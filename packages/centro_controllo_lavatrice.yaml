homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: "Centro Controllo Elettrodomestici"
      setting:
        ####################################################
        #                                                  #
        #              IMPOSTAZIONI PACKAGE                #
        #                                                  #
        ####################################################

        Sensore Consumo Elettrodomestici: &sensore_consumo_elettrodomestici_1 "{{ states('sensor.lavatrice_power')}}"
        Switch Power Elettrodomestici: &switch_elettrodomestici_1 "switch.elettrodomestico"

        Lista mediaplayer alexa: &alexa
          - media_player.alexa_salone

        Device per notifica push: &push
          - service: mobile_app_il_tuo_telefono
          - service: mobile_app_del_partner

####################################################
#                                                  #
#              NOTIFICHE GRUPPO                    #
#                                                  #
####################################################

notify:
  - name: Gruppo Centro Elettrodomestici 1
    platform: group
    services: *push

####################################################
#                                                  #
#                   SENSORI                        #
#                                                  #
####################################################

sensor:
  - platform: integration
    source: sensor.potenza_elettrodomestici_w_1
    name: w_kwh_elettrodomestici_1
    unit_prefix: k
    method: left
    round: 2

####################################################
#                                                  #
#               INPUT NUMBER                       #
#                                                  #
####################################################

input_number:
  soglia_lavoro_elettrodomestici_w_1:
    name: Soglia Lavoro Elettrodomestici W
    icon: mdi:flash
    min: 0
    max: 5000
    step: 1.00
    unit_of_measurement: "w"
    mode: box

  tempo_innesco_elettrodomestici_m_1:
    name: Tempo Innesco Elettrodomestici M
    icon: mdi:flash
    min: 0
    max: 60
    step: 1.00
    unit_of_measurement: "m"
    mode: box

  durata_minima_ciclo_elettrodomestici_m_1:
    name: Durata Minima Ciclo Elettrodomestici M
    icon: mdi:timer-alert
    min: 0
    max: 60
    step: 1.00
    initial: 10
    unit_of_measurement: "m"
    mode: box

  avvio_ritardato_conteggio_elettrodomestici_s_1:
    name: Avvio Ritardato Conteggio Elettrodomestici S
    icon: mdi:flash
    min: 0
    max: 60
    step: 1.00
    unit_of_measurement: "s"
    mode: box
    

  volume_alexa_notifica_elettrodomestici_1:
    name: Volume Alexa Notifica Elettrodomestici
    icon: mdi:volume-high
    min: 0
    max: 1
    step: 0.01
    mode: box

  ritardo_dopo_notifica_alexa_elettrodomestici_1:
    name: Ritardo Dopo Notifica Alexa Elettrodomestici
    icon: mdi:timer-outline
    min: 0
    max: 30
    step: 1
    unit_of_measurement: "s"
    mode: box

  volume_ripristino_alexa_elettrodomestici_1:
    name: Volume Ripristino Alexa Elettrodomestici
    icon: mdi:volume-medium
    min: 0
    max: 1
    step: 0.01
    mode: box

  ####################################################

  lunedi_elettrodomestici_consumo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  lunedi_elettrodomestici_costo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  martedi_elettrodomestici_consumo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  martedi_elettrodomestici_costo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  mercoledi_elettrodomestici_consumo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  mercoledi_elettrodomestici_costo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  giovedi_elettrodomestici_consumo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  giovedi_elettrodomestici_costo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  venerdi_elettrodomestici_consumo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  venerdi_elettrodomestici_costo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  sabato_elettrodomestici_consumo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  sabato_elettrodomestici_costo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  domenica_elettrodomestici_consumo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  domenica_elettrodomestici_costo_1:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

####################################################
#                                                  #
#                UTILITY METER                     #
#                                                  #
####################################################

utility_meter:
  # Tempo

  elettrodomestici_tempo_oggi_1:
    source: sensor.time_on_elettrodomestici_1
    cycle: daily

  elettrodomestici_tempo_mese_1:
    source: sensor.time_on_elettrodomestici_1
    cycle: monthly

  elettrodomestici_tempo_anno_1:
    source: sensor.time_on_elettrodomestici_1
    cycle: yearly

  ####################################################

  # Cicli

  cicli_oggi_elettrodomestici_1:
    source: counter.cicli_funzionamento_elettrodomestici_totale_1
    cycle: daily

  cicli_mese_elettrodomestici_1:
    source: counter.cicli_funzionamento_elettrodomestici_totale_1
    cycle: monthly

  cicli_anno_elettrodomestici_1:
    source: counter.cicli_funzionamento_elettrodomestici_totale_1
    cycle: yearly

  ####################################################

  # Consumi KWh

  energy_oggi_elettrodomestici_1:
    source: sensor.w_kwh_elettrodomestici_1
    cycle: daily

  energy_mese_elettrodomestici_1:
    source: sensor.w_kwh_elettrodomestici_1
    cycle: monthly

  energy_anno_elettrodomestici_1:
    source: sensor.w_kwh_elettrodomestici_1
    cycle: yearly

####################################################
#                                                  #
#               TEMPLATE                           #
#                                                  #
####################################################

template:
  - binary_sensor:
      - name: AC Elettrodomestici 1
        icon: mdi:state-machine
        state: "{{ 'on' if (states('sensor.potenza_elettrodomestici_w_1') | int(0) ) > states('input_number.soglia_lavoro_elettrodomestici_w_1')|int(0) else 'off' }}"
        delay_off: "00:{{ states('input_number.tempo_innesco_elettrodomestici_m_1')|int(0) }}:00"
        delay_on: "00:00:{{ states('input_number.avvio_ritardato_conteggio_elettrodomestici_s_1')|int(0) }}"

  ####################################################

  - trigger:
      - platform: state
        entity_id: input_boolean.durata_ciclo_attivo_elettrodomestici_1
        from: "off"
        to: "on"
    sensor:
      - name: Inizio Ciclo Elettrodomestici 1
        state: "{{states('sensor.w_kwh_elettrodomestici_1')}}"

  - trigger:
      - platform: state
        entity_id: binary_sensor.ac_elettrodomestici_1
        from: "on"
        to: "off"
    sensor:
      - name: Fine Ciclo Elettrodomestici 1
        state: "{{now().strftime('%d/%m/%Y %H:%M')}}"

  ####################################################

  - trigger:
      - platform: state
        entity_id: input_boolean.durata_ciclo_attivo_elettrodomestici_1
        from: "off"
        to: "on"
    sensor:
      - name: Tempo Riavvio 1
        state: "{{as_timestamp(now())}}"

  ####################################################

  - sensor:
      - name: "time_on_elettrodomestici_1"
        icon: mdi:history
        state: >-
          {%if is_state('binary_sensor.ac_elettrodomestici_1', 'on') and (as_timestamp(states.binary_sensor.ac_elettrodomestici_1.last_changed)+1) <= as_timestamp(now())%}
            {{((as_timestamp(now()) - as_timestamp(states.binary_sensor.ac_elettrodomestici_1.last_changed))/3600)}}
          {% else %} 0 {% endif %}
        attributes:
          terminato: "{{ states('sensor.fine_ciclo_elettrodomestici_1') if is_state('binary_sensor.ac_elettrodomestici_1', 'off') else 'In funzione' }}"
          tempo_ciclo_elettrodomestici_1: >
            {%set hours =(as_timestamp(now()) - states('sensor.tempo_riavvio_1')|float(0))/3600 %}
            {% set minutes = ((hours % 1) * 60) | int (0)%}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {%set day = ((hours |int(0) /24))|int(0) %}
            {%if is_state('input_boolean.durata_ciclo_attivo_elettrodomestici_1', 'on')%}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int(0))-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
            {%else%}
            {{states('input_text.ultimo_ciclo_attivo_elettrodomestici_1')}}
            {%endif%}
          Oggi: >
            {% set hours = states('sensor.elettrodomestici_tempo_oggi_1') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
              {% if hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
          Mese: >
            {% set hours = states('sensor.elettrodomestici_tempo_mese_1') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours |int /24))|int(0) %}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int)-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
          Anno: >
            {% set hours = states('sensor.elettrodomestici_tempo_anno_1') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours |int(0) /24))|int(0) %}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int(0))-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
          Ieri: >
            {% set hours = state_attr('sensor.elettrodomestici_tempo_oggi_1', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
              {% if hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
          Mese Precedente: >
            {% set hours = state_attr('sensor.elettrodomestici_tempo_mese_1', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours |int /24))|int(0) %}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int)-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
          Anno Precedente: >
            {% set hours = state_attr('sensor.elettrodomestici_tempo_anno_1', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = (hours - (hours % 1)) | int(0) %}
            {% set day = ((hours |int(0) /24))|int(0) %}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int(0))-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}

          consumo_ciclo_elettrodomestici_1: "{{(states('sensor.w_kwh_elettrodomestici_1')|float(0)-states('sensor.inizio_ciclo_elettrodomestici_1')|float(0))|round(2)}} kWh"
          costo_ciclo_elettrodomestici_1: "{{((states('sensor.w_kwh_elettrodomestici_1')|float(0)-states('sensor.inizio_ciclo_elettrodomestici_1')|float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"

          costo_consumo_giornaliero_elettrodomestici_1: "{{((states('sensor.energy_oggi_elettrodomestici_1') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          costo_consumo_mensile_elettrodomestici_1: "{{((states('sensor.energy_mese_elettrodomestici_1') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          costo_consumo_annuale_elettrodomestici_1: "{{((states('sensor.energy_anno_elettrodomestici_1') | float(0)) * (states('input_number.costo_energia') | float(0))) | round(2, default=0) }}"

          costo_consumo_ieri_elettrodomestici_1: "{{((state_attr('sensor.energy_oggi_elettrodomestici_1', 'last_period') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          costo_consumo_mese_precedente_elettrodomestici_1: "{{((state_attr('sensor.energy_mese_elettrodomestici_1', 'last_period') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          costo_consumo_anno_precedente_elettrodomestici_1: "{{((state_attr('sensor.energy_anno_elettrodomestici_1', 'last_period') | float(0)) * (states('input_number.costo_energia') | float(0))) | round(2, default=0) }}"

  - sensor:
      - name: "potenza_elettrodomestici_w_1"
        unit_of_measurement: "W"
        state: *sensore_consumo_elettrodomestici_1
        icon: mdi:flash

####################################################
#                                                  #
#               CUONTER                            #
#                                                  #
####################################################

counter:
  cicli_funzionamento_elettrodomestici_totale_1:
    name: Cicli Funzionamento Elettrodomestici Totale
    initial: 0
    step: 1

####################################################
#                                                  #
#               INPUT BOOLEAN                      #
#                                                  #
####################################################

input_boolean:
  switch_elettrodomestici_1:
    name: Switch Elettrodomestici
    icon: mdi:flash

  ####################################################

  durata_ciclo_attivo_elettrodomestici_1:
    name: Ciclo Attivo Elettrodomestici

  ####################################################

  notify_push_elettrodomestici_1:
    name: Notifica Push

  ####################################################

  notify_alexa_elettrodomestici_1:
    name: Notifica Alexa

####################################################
#                                                  #
#                     GROUP                        #
#                                                  #
####################################################

group:
  notifiche_elettrodomestici_1:
    entities:
      - input_boolean.notify_alexa_elettrodomestici_1
      - input_boolean.notify_push_elettrodomestici_1
      - automation.elettrodomestici_off_automatico_1
      - input_boolean.switch_elettrodomestici_1

####################################################
#                                                  #
#                  INPUT DATETIME                  #
#                                                  #
####################################################

input_datetime:
  orario_inizio_notifiche_elettrodomestici_1:
    name: Orario Inizio Notifiche Elettrodomestici
    has_date: false
    has_time: true

  ####################################################

  orario_fine_notifiche_elettrodomestici_1:
    name: Orario Fine Notifiche Elettrodomestici
    has_date: false
    has_time: true

  ####################################################

  elettrodomestici_off_1:
    name: Elettrodomestici Off
    has_date: false
    has_time: true

####################################################
#                                                  #
#                 INPUT TEXT                       #
#                                                  #
####################################################

input_text:
  data_reset_sensori_elettrodomestici_1:

  ####################################################

  nome_elettrodomestico_1:

  ####################################################

  messaggio_elettrodomestico_1:

  ####################################################

  ultimo_ciclo_attivo_elettrodomestici_1:

  ####################################################
  ####################################################

  lunedi_elettrodomestici_cicli_1:
  lunedi_elettrodomestici_tempo_1:

  ####################################################

  martedi_elettrodomestici_cicli_1:
  martedi_elettrodomestici_tempo_1:

  ####################################################

  mercoledi_elettrodomestici_cicli_1:
  mercoledi_elettrodomestici_tempo_1:

  ####################################################

  giovedi_elettrodomestici_cicli_1:
  giovedi_elettrodomestici_tempo_1:

  ####################################################

  venerdi_elettrodomestici_cicli_1:
  venerdi_elettrodomestici_tempo_1:

  ####################################################

  sabato_elettrodomestici_cicli_1:
  sabato_elettrodomestici_tempo_1:

  ####################################################

  domenica_elettrodomestici_cicli_1:
  domenica_elettrodomestici_tempo_1:

####################################################
#                                                  #
#                       SCRIPT                     #
#                                                  #
####################################################

script:
  reset_sensori_elettrodomestici_1:
    sequence:
      - service: input_text.set_value
        data:
          value: >-
            {{now().strftime('%d/%m/%Y %H:%M')}}
        target:
          entity_id: input_text.data_reset_sensori_elettrodomestici_1
      - service: utility_meter.calibrate
        data:
          value: "0"
        target:
          entity_id:
            - sensor.cicli_oggi_elettrodomestici_1
            - sensor.cicli_mese_elettrodomestici_1
            - sensor.cicli_anno_elettrodomestici_1
            - sensor.energy_oggi_elettrodomestici_1
            - sensor.energy_mese_elettrodomestici_1
            - sensor.energy_anno_elettrodomestici_1
            - sensor.elettrodomestici_tempo_oggi_1
            - sensor.elettrodomestici_tempo_mese_1
            - sensor.elettrodomestici_tempo_anno_1

      - service: input_number.set_value
        data:
          value: "0"
        target:
          entity_id:
            - input_number.lunedi_elettrodomestici_consumo_1
            - input_number.martedi_elettrodomestici_consumo_1
            - input_number.mercoledi_elettrodomestici_consumo_1
            - input_number.giovedi_elettrodomestici_consumo_1
            - input_number.venerdi_elettrodomestici_consumo_1
            - input_number.sabato_elettrodomestici_consumo_1
            - input_number.domenica_elettrodomestici_consumo_1
            - input_number.lunedi_elettrodomestici_costo_1
            - input_number.martedi_elettrodomestici_costo_1
            - input_number.mercoledi_elettrodomestici_costo_1
            - input_number.giovedi_elettrodomestici_costo_1
            - input_number.venerdi_elettrodomestici_costo_1
            - input_number.sabato_elettrodomestici_costo_1
            - input_number.domenica_elettrodomestici_costo_1

      - service: input_text.set_value
        data:
          value: "0"
        target:
          entity_id:
            - input_text.lunedi_elettrodomestici_cicli_1
            - input_text.martedi_elettrodomestici_cicli_1
            - input_text.mercoledi_elettrodomestici_cicli_1
            - input_text.giovedi_elettrodomestici_cicli_1
            - input_text.venerdi_elettrodomestici_cicli_1
            - input_text.sabato_elettrodomestici_cicli_1
            - input_text.domenica_elettrodomestici_cicli_1
            - input_text.lunedi_elettrodomestici_tempo_1
            - input_text.martedi_elettrodomestici_tempo_1
            - input_text.mercoledi_elettrodomestici_tempo_1
            - input_text.giovedi_elettrodomestici_tempo_1
            - input_text.venerdi_elettrodomestici_tempo_1
            - input_text.sabato_elettrodomestici_tempo_1
            - input_text.domenica_elettrodomestici_tempo_1

      - service: counter.reset
        target:
          entity_id:
            - counter.cicli_funzionamento_elettrodomestici_totale_1

####################################################
#                                                  #
#                     AUTOMAZIONI                  #
#                                                  #
####################################################

automation:
  - alias: Automazioni Elettrodomestici 1
    id: Automazioni Elettrodomestici 1
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id: binary_sensor.ac_elettrodomestici_1
        from: "off"
        to: "on"
        id: inizio_ciclo

      - platform: state
        entity_id: binary_sensor.ac_elettrodomestici_1
        from: "on"
        to: "off"
        id: fine_ciclo

      - platform: time
        at: "23:59:59"
        id: incremento_sensori_7_giorni_elettrodomestici

      - platform: state
        entity_id:
          - input_boolean.switch_elettrodomestici_1
          - *switch_elettrodomestici_1
        from: "on"
        to: "off"
        id: switch_off

      - platform: state
        entity_id:
          - input_boolean.switch_elettrodomestici_1
          - *switch_elettrodomestici_1
        from: "off"
        to: "on"
        id: switch_on

      - platform: template
        value_template: "{{ is_state('binary_sensor.ac_elettrodomestici_1','off') and is_state('input_boolean.durata_ciclo_attivo_elettrodomestici_1','on') }}"
        id: controllo_ciclo

    action:
      ####################################################
      # Incremento 7 Giorni Statistiche

      - choose:
          - conditions:
              - condition: trigger
                id: incremento_sensori_7_giorni_elettrodomestici
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: >
                    {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
                    {% if (today in ["Monday"]) %} input_text.lunedi_elettrodomestici_cicli_1
                    {% elif (today in ["Tuesday"]) %} input_text.martedi_elettrodomestici_cicli_1
                    {% elif (today in ["Wednesday"]) %} input_text.mercoledi_elettrodomestici_cicli_1
                    {% elif (today in ["Thursday"]) %} input_text.giovedi_elettrodomestici_cicli_1
                    {% elif (today in ["Friday"]) %} input_text.venerdi_elettrodomestici_cicli_1
                    {% elif (today in ["Saturday"]) %} input_text.sabato_elettrodomestici_cicli_1
                    {% elif (today in ["Sunday"]) %} input_text.domenica_elettrodomestici_cicli_1
                    {% endif %}
                data:
                  value: "{{states('sensor.cicli_oggi_elettrodomestici_1')}}"

              - service: input_text.set_value
                target:
                  entity_id: >
                    {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
                    {% if (today in ["Monday"]) %} input_text.lunedi_elettrodomestici_tempo_1
                    {% elif (today in ["Tuesday"]) %} input_text.martedi_elettrodomestici_tempo_1
                    {% elif (today in ["Wednesday"]) %} input_text.mercoledi_elettrodomestici_tempo_1
                    {% elif (today in ["Thursday"]) %} input_text.giovedi_elettrodomestici_tempo_1
                    {% elif (today in ["Friday"]) %} input_text.venerdi_elettrodomestici_tempo_1
                    {% elif (today in ["Saturday"]) %} input_text.sabato_elettrodomestici_tempo_1
                    {% elif (today in ["Sunday"]) %} input_text.domenica_elettrodomestici_tempo_1
                    {% endif %}
                data:
                  value: "{{state_attr('sensor.time_on_elettrodomestici_1','Oggi')}}"

              - service: input_number.set_value
                target:
                  entity_id: >
                    {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
                    {% if (today in ["Monday"]) %} input_number.lunedi_elettrodomestici_consumo_1
                    {% elif (today in ["Tuesday"]) %} input_number.martedi_elettrodomestici_consumo_1
                    {% elif (today in ["Wednesday"]) %} input_number.mercoledi_elettrodomestici_consumo_1
                    {% elif (today in ["Thursday"]) %} input_number.giovedi_elettrodomestici_consumo_1
                    {% elif (today in ["Friday"]) %} input_number.venerdi_elettrodomestici_consumo_1
                    {% elif (today in ["Saturday"]) %} input_number.sabato_elettrodomestici_consumo_1
                    {% elif (today in ["Sunday"]) %} input_number.domenica_elettrodomestici_consumo_1
                    {% endif %}
                data:
                  value: "{{states('sensor.energy_oggi_elettrodomestici_1')}}"

              - service: input_number.set_value
                target:
                  entity_id: >
                    {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
                    {% if (today in ["Monday"]) %} input_number.lunedi_elettrodomestici_costo_1
                    {% elif (today in ["Tuesday"]) %} input_number.martedi_elettrodomestici_costo_1
                    {% elif (today in ["Wednesday"]) %} input_number.mercoledi_elettrodomestici_costo_1
                    {% elif (today in ["Thursday"]) %} input_number.giovedi_elettrodomestici_costo_1
                    {% elif (today in ["Friday"]) %} input_number.venerdi_elettrodomestici_costo_1
                    {% elif (today in ["Saturday"]) %} input_number.sabato_elettrodomestici_costo_1
                    {% elif (today in ["Sunday"]) %} input_number.domenica_elettrodomestici_costo_1
                    {% endif %}
                data:
                  value: "{{state_attr('sensor.time_on_elettrodomestici_1','costo_consumo_giornaliero_elettrodomestici_1')}}"

      ####################################################
      # Switch & Boolean OFF

      - choose:
          - alias: SWITCH E BOOLEAN OFF
            conditions:
              - condition: trigger
                id: switch_off
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: *switch_elettrodomestici_1
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.switch_elettrodomestici_1

      ####################################################
      # Switch & Boolean ON

      - choose:
          - alias: SWITCH E BOOLEAN ON
            conditions:
              - condition: trigger
                id: switch_on
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: *switch_elettrodomestici_1
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.switch_elettrodomestici_1

      ####################################################
      # Controllo Ciclo

      - choose:
          - conditions:
              - condition: trigger
                id: controllo_ciclo
            sequence:
              - delay: "00:00:10"
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.durata_ciclo_attivo_elettrodomestici_1

      ####################################################
      # Inizio Ciclo

      - choose:
          - conditions:
              - condition: trigger
                id: inizio_ciclo
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.durata_ciclo_attivo_elettrodomestici_1
              - service: input_text.set_value
                target:
                  entity_id: input_text.ultimo_ciclo_attivo_elettrodomestici_1
                data:
                  value: "0min"

      ####################################################
      # Fine Ciclo

      - choose:
          - conditions:
              - condition: trigger
                id: fine_ciclo
              # Esclude falsi cicli (es. accensione solo per programmare):
              # la durata reale deve superare la soglia minima configurata.
              - condition: template
                value_template: "{{ (as_timestamp(now()) - (states('sensor.tempo_riavvio_1')|float(0))) >= (states('input_number.durata_minima_ciclo_elettrodomestici_m_1')|float(10) * 60) }}"
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.ultimo_ciclo_attivo_elettrodomestici_1
                data:
                  value: >-
                    {{state_attr('sensor.time_on_elettrodomestici_1','tempo_ciclo_elettrodomestici_1')}}

              - service: counter.increment
                target:
                  entity_id:
                    - counter.cicli_funzionamento_elettrodomestici_totale_1

              - delay: "00:00:05"

              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.durata_ciclo_attivo_elettrodomestici_1

      ####################################################
      # Notifiche

      - parallel:
          - choose:
              - conditions:
                  - condition: trigger
                    id: fine_ciclo
                  - condition: template
                    value_template: "{{ (as_timestamp(now()) - (states('sensor.tempo_riavvio_1')|float(0))) >= (states('input_number.durata_minima_ciclo_elettrodomestici_m_1')|float(10) * 60) }}"
                  - condition: time
                    after: "input_datetime.orario_inizio_notifiche_alexa"
                    before: "input_datetime.orario_fine_notifiche_alexa"
                  - condition: state
                    entity_id: input_boolean.notify_alexa_elettrodomestici_1
                    state: "on"
                sequence:
                  - service: script.notifica_vocale_alexa
                    data:
                      messaggio: "{{states('input_text.messaggio_elettrodomestico_1')}} in {{state_attr('sensor.time_on_elettrodomestici_1','tempo_ciclo_elettrodomestici_1')}}"

          - choose:
              - conditions:
                  - condition: trigger
                    id: fine_ciclo
                  - condition: template
                    value_template: "{{ (as_timestamp(now()) - (states('sensor.tempo_riavvio_1')|float(0))) >= (states('input_number.durata_minima_ciclo_elettrodomestici_m_1')|float(10) * 60) }}"
                  - condition: state
                    entity_id: input_boolean.notify_push_elettrodomestici_1
                    state: "on"
                sequence:
                  - service: telegram_bot.send_message
                    data:
                      parse_mode: html
                      chat_id:
                        - 111111111
                        - 222222222
                      message: >-
                        📌 {{states('input_text.messaggio_elettrodomestico_1')}}
                        ⏱ {{state_attr('sensor.time_on_elettrodomestici_1','tempo_ciclo_elettrodomestici_1')}}
                        ⚡️ Consumati: {{state_attr('sensor.time_on_elettrodomestici_1','consumo_ciclo_elettrodomestici_1')}}
                        💰 Spesi: {{state_attr('sensor.time_on_elettrodomestici_1','costo_ciclo_elettrodomestici_1')}} €
                      title: "<b>{{states('input_text.nome_elettrodomestico_1')}}</b>"
                      config_entry_id: 01K0FKKH55FNWJTH21DGMHJWCE

                  - service: notify.mobile_app_il_tuo_telefono
                    data:
                      title: "{{states('input_text.nome_elettrodomestico_1')}}"
                      message: >-
                        📌 {{states('input_text.messaggio_elettrodomestico_1')}}
                        ⏱ {{state_attr('sensor.time_on_elettrodomestici_1','tempo_ciclo_elettrodomestici_1')}}
                        ⚡️ Consumati: {{state_attr('sensor.time_on_elettrodomestici_1','consumo_ciclo_elettrodomestici_1')}}
                        💰 Spesi: {{state_attr('sensor.time_on_elettrodomestici_1','costo_ciclo_elettrodomestici_1')}} €

                  - service: notify.mobile_app_del_partner
                    data:
                      title: "{{states('input_text.nome_elettrodomestico_1')}}"
                      message: >-
                        📌 {{states('input_text.messaggio_elettrodomestico_1')}}
                        ⏱ {{state_attr('sensor.time_on_elettrodomestici_1','tempo_ciclo_elettrodomestici_1')}}
                        ⚡️ Consumati: {{state_attr('sensor.time_on_elettrodomestici_1','consumo_ciclo_elettrodomestici_1')}}
                        💰 Spesi: {{state_attr('sensor.time_on_elettrodomestici_1','costo_ciclo_elettrodomestici_1')}} €

  ####################################################
  - alias: Elettrodomestici OFF Automatico 1
    id: Elettrodomestici OFF Automatico 1
    trigger:
      - platform: time
        at: "input_datetime.elettrodomestici_off_1"
        id: elettrodomestici_automatico_off
    condition: []
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: elettrodomestici_automatico_off
              - condition: state
                entity_id: *switch_elettrodomestici_1
                state: "on"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: *switch_elettrodomestici_1