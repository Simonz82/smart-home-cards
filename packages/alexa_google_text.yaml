homeassistant:
  time_zone: Europe/Rome
  customize:
    package.node_anchors:
      customize: &customize
        package: 'Alexa Google Speak Text'

####################################################
#                                                  #
#            IMPOSTAZIONI PACKAGE                  #
#                                                  #
####################################################

      setting:
        Device per notifica push: &push
          - service: mobile_app_il_tuo_telefono
          - service: mobile_app_xxx

####################################################
#                                                  #
#                SPEAKER ALEXA                     #
#                                                  #
####################################################

input_select:
  list_alexa_google_speaker_multiroom_text:
    name: 'Alexa Google Speaker Multiroom text:'
    options: # inserire nella lista sottostante il FRIENDLY NAME dei media_player
      - "Alexa Salone"
      - "Alexa bagno"
      - "Alexa Cameretta"
      - "Alexa Camera"
      - "Alexa Ovunque"
    icon: mdi:speaker-wireless

####################################################
#                                                  #
#            NOTIFICHE GRUPPO                      #
#                                                  #
####################################################

notify:
  - name: Notifiche Alexa Google Text
    platform: group
    services: *push

####################################################
#                                                  #
#                INPUT TEXT                        #
#                                                  #
####################################################

input_text:
  multiroom_alexa_google_text:

  alexa_google_text:
    name: Alexa Google Text
    initial: Testo

####################################################
#                                                  #
#            INPUT SELECT GRUPPO                   #
#                                                  #
####################################################

group:
  multiroom_alexa_google_text:
    name: Multiroom Alexa Google Text

####################################################
#                                                  #
#                  TEMPLATE (SENSORI)              #
#                                                  #
####################################################

template:
  - sensor:
      # OLD: sensor.alexa_google_speaker_multiroom_text
      - name: alexa_google_speaker_multiroom_text
        state: >
          {%- set domain = ['media_player']-%}
          {%- for device in states if device.domain in domain -%}
          {%- if device.name|lower == states('input_select.list_alexa_google_speaker_multiroom_text')|lower -%}
          {{ device.entity_id }}
          {%- endif -%}
          {%- endfor -%}

      # OLD: sensor.sensore_alexa_google_text
      - name: sensore_alexa_google_text
        state: "{% if is_state('null', 'on') %}1.2{% else %}1.2{% endif %}"

####################################################
#                                                  #
#                     SENSORI                      #
#                                                  #
####################################################

####################################################
#                                                  #
#                INPUT NUMBER                      #
#                                                  #
####################################################

input_number:
  volume_alexa_google_text:
    name: Volume
    icon: mdi:volume-high
    min: 0
    max: 1
    step: 0.05

####################################################
#                                                  #
#                     SCRIPT                       #
#                                                  #
####################################################

script:
  remove_alexa_google_text:
    alias: "Rimuovi Alexa Google Text"
    mode: single
    sequence:
      - service: group.set
        # CORREZIONE: Sostituito data_template con data
        data:
          object_id: multiroom_alexa_google_text
          entities: >-
            {{state_attr('group.multiroom_alexa_google_text','entity_id')|list|select('ne',states('sensor.alexa_google_speaker_multiroom_text'))|list }}

      - service: input_text.set_value
        target:
          entity_id: input_text.multiroom_alexa_google_text
        data:
          value: >-
            {{state_attr('group.multiroom_alexa_google_text','entity_id')|list }}

      - service: group.set
        # CORREZIONE: Sostituito data_template con data
        data:
          object_id: multiroom_alexa_google_text
          entities: >-
            {{state_attr('group.multiroom_alexa_google_text','entity_id')|list|select('ne',states('sensor.alexa_google_speaker_multiroom_text'))|list }}
      - service: input_text.set_value
        target:
          entity_id: input_text.multiroom_alexa_google_text
        data:
          value: >-
            {{state_attr('group.multiroom_alexa_google_text','entity_id')|list }}

  ####################################################

  add_alexa_google_text:
    alias: Aggiungi Alexa Google Text
    mode: single
    sequence:
      - service: group.set
        # CORREZIONE: Sostituito data_template con data
        data:
          object_id: multiroom_alexa_google_text
          entities: >-
            {% set ns = namespace(entities=state_attr('group.multiroom_alexa_google_text','entity_id')|list|select('ne',states('sensor.alexa_google_speaker_multiroom_text'))|list)%}
            {{ ns.entities + [states('sensor.alexa_google_speaker_multiroom_text')] }}
      - service: input_text.set_value
        target:
          entity_id: input_text.multiroom_alexa_google_text
        data:
          value: >-
            {{state_attr('group.multiroom_alexa_google_text','entity_id')|list }}

  ####################################################

  alexa_text_normale:
    alias: Alexa Text Normale
    sequence:
    - service: notify.alexa_media
      # CORREZIONE: Sintassi moderna e pulita per i servizi
      data:
        data:
          type: tts
        target:
          - group.multiroom_alexa_google_text
        message: "-{{states('input_text.alexa_google_text')}}."

####################################################
#                                                  #
#                   AUTOMAZIONI                    #
#                                                  #
####################################################

automation:
- alias: Livello Volume Alexa Google TEXT
  id: Livello Volume Alexa Google TEXT
  trigger:
  - platform: state
    entity_id: input_number.volume_alexa_google_text
  condition: []
  action:
  - service: media_player.volume_set
    data:
      entity_id: "{{ state_attr('group.multiroom_alexa_google_text', 'entity_id') }}"
      volume_level: "{{ states('input_number.volume_alexa_google_text') }}" # Rimosso .state

####################################################