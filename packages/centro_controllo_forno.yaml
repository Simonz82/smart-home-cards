homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: "Centro Controllo Elettrodomestici"
      setting:
        ####################################################
        #                                                  #
        #            IMPOSTAZIONI PACKAGE                  #
        #                                                  #
        ####################################################

        Sensore Consumo Elettrodomestici: &sensore_consumo_elettrodomestici_2 "{{ states('sensor.forno_power')}}"
        Switch Power Elettrodomestici: &switch_elettrodomestici_2 "switch.elettrodomestico"

        Lista mediaplayer alexa: &alexa
          - media_player.alexa_salone

        Device per notifica push: &push
          - service: xxx

####################################################
#                                                  #
#            NOTIFICHE GRUPPO                      #
#                                                  #
####################################################

notify:
  - name: Gruppo Centro Elettrodomestici 2
    platform: group
    services:
      - service: mobile_app_il_tuo_telefono
      - service: mobile_app_del_partner #aggiunto dopo

####################################################
#                                                  #
#            SENSORI (NON TEMPLATE)                #
#                                                  #
####################################################

sensor:
  # Questo è il sensore 'integration' e NON TEMPLATE, resta qui.
  - platform: integration
    source: sensor.potenza_elettrodomestici_w_2
    name: w_kwh_elettrodomestici_2
    unit_prefix: k
    method: left
    round: 2

####################################################
#                                                  #
#                INPUT NUMBER                      #
#                                                  #
####################################################

input_number:
  soglia_lavoro_elettrodomestici_w_2:
    name: Soglia Lavoro Elettrodomestici W
    icon: mdi:flash
    min: 0
    max: 5000
    step: 2.00
    unit_of_measurement: "W"
    mode: box

  tempo_innesco_elettrodomestici_m_2:
    name: Tempo Innesco Elettrodomestici M
    icon: mdi:flash
    min: 0
    max: 60
    step: 2.00
    unit_of_measurement: "m"
    mode: box

  avvio_ritardato_conteggio_elettrodomestici_s_2:
    name: Avvio Ritardato Conteggio Elettrodomestici S
    icon: mdi:flash
    min: 0
    max: 60
    step: 2.00
    unit_of_measurement: "s"
    mode: box

  volume_alexa_notifica_elettrodomestici_2:
    name: Volume Notifica Alexa Elettrodomestici
    min: 0
    max: 1
    step: 0.1
    unit_of_measurement: ""
    icon: mdi:volume-high
    initial: 0.5
  ritardo_dopo_notifica_alexa_elettrodomestici_2:
    name: Ritardo Dopo Notifica Alexa Elettrodomestici
    min: 5
    max: 30
    step: 1
    unit_of_measurement: "sec"
    icon: mdi:timer
    initial: 10
  volume_ripristino_alexa_elettrodomestici_2:
    name: Volume Ripristino Alexa Elettrodomestici
    min: 0
    max: 1
    step: 0.1
    unit_of_measurement: ""
    icon: mdi:volume-low
    initial: 0.1

  ####################################################

  lunedi_elettrodomestici_consumo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  lunedi_elettrodomestici_costo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  martedi_elettrodomestici_consumo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  martedi_elettrodomestici_costo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  mercoledi_elettrodomestici_consumo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  mercoledi_elettrodomestici_costo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  giovedi_elettrodomestici_consumo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  giovedi_elettrodomestici_costo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  venerdi_elettrodomestici_consumo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  venerdi_elettrodomestici_costo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  sabato_elettrodomestici_consumo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  sabato_elettrodomestici_costo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

  ####################################################

  domenica_elettrodomestici_consumo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "kwh"

  domenica_elettrodomestici_costo_2:
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: "€"

####################################################
#                                                  #
#                UTILITY METER                     #
#                                                  #
####################################################

utility_meter:
  # Tempo

  elettrodomestici_tempo_oggi_2:
    source: sensor.time_on_elettrodomestici_2
    cycle: daily

  elettrodomestici_tempo_mese_2:
    source: sensor.time_on_elettrodomestici_2
    cycle: monthly

  elettrodomestici_tempo_anno_2:
    source: sensor.time_on_elettrodomestici_2
    cycle: yearly

  ####################################################

  # Cicli

  cicli_oggi_elettrodomestici_2:
    source: counter.cicli_funzionamento_elettrodomestici_totale_2
    cycle: daily

  cicli_mese_elettrodomestici_2:
    source: counter.cicli_funzionamento_elettrodomestici_totale_2
    cycle: monthly

  cicli_anno_elettrodomestici_2:
    source: counter.cicli_funzionamento_elettrodomestici_totale_2
    cycle: yearly

  ####################################################

  # Consumi KWh

  energy_oggi_elettrodomestici_2:
    source: sensor.w_kwh_elettrodomestici_2
    cycle: daily

  energy_mese_elettrodomestici_2:
    source: sensor.w_kwh_elettrodomestici_2
    cycle: monthly

  energy_anno_elettrodomestici_2:
    source: sensor.w_kwh_elettrodomestici_2
    cycle: yearly

####################################################
#                                                  #
#                TEMPLATE (MIGRATO)                #
#                                                  #
####################################################

template:
  - sensor:
      # OLD: sensor.potenza_elettrodomestici_w_2
      - name: Potenza Elettrodomestici W
        unit_of_measurement: "W"
        icon: mdi:flash
        state: *sensore_consumo_elettrodomestici_2
        default_entity_id: sensor.potenza_elettrodomestici_w_2 # Mantiene ID per utility_meter

  - binary_sensor:
      - name: AC Elettrodomestici 2
        icon: mdi:state-machine
        state: "{{ 'on' if (states('sensor.potenza_elettrodomestici_w_2') | int(0) ) > states('input_number.soglia_lavoro_elettrodomestici_w_2')|int(0) else 'off' }}"
        delay_off: "00:{{ states('input_number.tempo_innesco_elettrodomestici_m_2')|int(0) }}:00"
        delay_on: "00:00:{{ states('input_number.avvio_ritardato_conteggio_elettrodomestici_s_2')|int(0) }}"

  ####################################################

  - trigger:
      - platform: state
        entity_id: input_boolean.durata_ciclo_attivo_elettrodomestici_2
        from: "off"
        to: "on"
    sensor:
      - name: Inizio Ciclo Elettrodomestici 2
        state: "{{states('sensor.w_kwh_elettrodomestici_2')}}"

  - trigger:
      - platform: state
        entity_id: binary_sensor.ac_elettrodomestici_2
        from: "on"
        to: "off"
    sensor:
      - name: Fine Ciclo Elettrodomestici 2
        state: "{{now().strftime('%d/%m/%Y %H:%M')}}"

  ####################################################

  - trigger:
      - platform: state
        entity_id: input_boolean.durata_ciclo_attivo_elettrodomestici_2
        from: "off"
        to: "on"
    sensor:
      - name: Tempo Riavvio 2
        state: "{{as_timestamp(now())}}"

  ####################################################

  - sensor:
      - name: "time_on_elettrodomestici_2"
        icon: mdi:history
        state: >-
          {%if is_state('binary_sensor.ac_elettrodomestici_2', 'on') and (as_timestamp(states.binary_sensor.ac_elettrodomestici_2.last_changed)+1) <= as_timestamp(now())%}
            {{((as_timestamp(now()) - as_timestamp(states.binary_sensor.ac_elettrodomestici_2.last_changed))/3600) | round(2)}}
          {% else %} 0 {% endif %}
        attributes:
          terminato: "{{ states('sensor.fine_ciclo_elettrodomestici_2') if is_state('binary_sensor.ac_elettrodomestici_2', 'off') else 'In funzione' }}"
          tempo_ciclo_elettrodomestici_2: >
            {%set hours =(as_timestamp(now()) - states('sensor.tempo_riavvio_2')|float(0))/3600 %}
            {% set minutes = ((hours % 1) * 60) | int (0)%}
            {% set hours = hours | int(0) %}
            {%set day = ((hours |int(0) /24))|int(0) %}
            {%if is_state('input_boolean.durata_ciclo_attivo_elettrodomestici_2', 'on')%}
              {% if day|int(0) >0 %}
                {{day}}d {{(hours|int(0))-(day*24)}}h {{minutes}}m
              {% elif hours|int(0) >0 %}
                {{hours}}h {{minutes}}m
              {% else %}
                {{minutes}}min
              {% endif %}
            {%else%}
            {{states('input_text.ultimo_ciclo_attivo_elettrodomestici_2')}}
            {%endif%}
          Oggi: >
            {% set hours = states('sensor.elettrodomestici_tempo_oggi_2') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = hours | int(0) %}
            {% if hours|int(0) >0 %}
              {{hours}}h {{minutes}}m
            {% else %}
              {{minutes}}min
            {% endif %}
          Mese: >
            {% set hours = states('sensor.elettrodomestici_tempo_mese_2') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = hours | int(0) %}
            {% set day = ((hours |int /24))|int(0) %}
            {% if day|int(0) >0 %}
              {{day}}d {{(hours|int)-(day*24)}}h {{minutes}}m
            {% elif hours|int(0) >0 %}
              {{hours}}h {{minutes}}m
            {% else %}
              {{minutes}}min
            {% endif %}
          Anno: >
            {% set hours = states('sensor.elettrodomestici_tempo_anno_2') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = hours | int(0) %}
            {% set day = ((hours |int(0) /24))|int(0) %}
            {% if day|int(0) >0 %}
              {{day}}d {{(hours|int(0))-(day*24)}}h {{minutes}}m
            {% elif hours|int(0) >0 %}
              {{hours}}h {{minutes}}m
            {% else %}
              {{minutes}}min
            {% endif %}
          Ieri: >
            {% set hours = state_attr('sensor.elettrodomestici_tempo_oggi_2', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = hours | int(0) %}
            {% if hours|int(0) >0 %}
              {{hours}}h {{minutes}}m
            {% else %}
              {{minutes}}min
            {% endif %}
          Mese Precedente: >
            {% set hours = state_attr('sensor.elettrodomestici_tempo_mese_2', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = hours | int(0) %}
            {% set day = ((hours |int /24))|int(0) %}
            {% if day|int(0) >0 %}
              {{day}}d {{(hours|int)-(day*24)}}h {{minutes}}m
            {% elif hours|int(0) >0 %}
              {{hours}}h {{minutes}}m
            {% else %}
              {{minutes}}min
            {% endif %}
          Anno Precedente: >
            {% set hours = state_attr('sensor.elettrodomestici_tempo_anno_2', 'last_period') | float(0) %}
            {% set minutes = ((hours % 1) * 60) | int(0) %}
            {% set hours = hours | int(0) %}
            {% set day = ((hours |int(0) /24))|int(0) %}
            {% if day|int(0) >0 %}
              {{day}}d {{(hours|int(0))-(day*24)}}h {{minutes}}m
            {% elif hours|int(0) >0 %}
              {{hours}}h {{minutes}}m
            {% else %}
              {{minutes}}min
            {% endif %}

          consumo_ciclo_elettrodomestici_2: "{{(states('sensor.w_kwh_elettrodomestici_2')|float(0)-states('sensor.inizio_ciclo_elettrodomestici_2')|float(0))|round(2)}} kWh"
          costo_ciclo_elettrodomestici_2: "{{((states('sensor.w_kwh_elettrodomestici_2')|float(0)-states('sensor.inizio_ciclo_elettrodomestici_2')|float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"

          costo_consumo_giornaliero_elettrodomestici_2: "{{((states('sensor.energy_oggi_elettrodomestici_2') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          costo_consumo_mensile_elettrodomestici_2: "{{((states('sensor.energy_mese_elettrodomestici_2') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          costo_consumo_annuale_elettrodomestici_2: "{{((states('sensor.energy_anno_elettrodomestici_2') | float(0)) * (states('input_number.costo_energia') | float(0))) | round(2, default=0) }}"

          costo_consumo_ieri_elettrodomestici_2: "{{((state_attr('sensor.energy_oggi_elettrodomestici_2', 'last_period') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          costo_consumo_mese_precedente_elettrodomestici_2: "{{((state_attr('sensor.energy_mese_elettrodomestici_2', 'last_period') | float(0)) * (states('input_number.costo_energia')| float(0))) | round(2, default=0) }}"
          costo_consumo_anno_precedente_elettrodomestici_2: "{{((state_attr('sensor.energy_anno_elettrodomestici_2', 'last_period') | float(0)) * (states('input_number.costo_energia') | float(0))) | round(2, default=0) }}"

####################################################
#                                                  #
#                COUNTER                           #
#                                                  #
####################################################

counter:
  cicli_funzionamento_elettrodomestici_totale_2:
    name: Cicli Funzionamento Elettrodomestici Totale
    initial: 0
    step: 2

####################################################
#                                                  #
#                INPUT BOOLEAN                     #
#                                                  #
####################################################

input_boolean:
  switch_elettrodomestici_2:
    name: Switch Elettrodomestici
    icon: mdi:flash

  ####################################################

  durata_ciclo_attivo_elettrodomestici_2:
    name: Ciclo Attivo Elettrodomestici

  ####################################################

  notify_push_elettrodomestici_2:
    name: Notifica Push

  ####################################################

  notify_alexa_elettrodomestici_2:
    name: Notifica Alexa

  ####################################################

  aggiornamento_pkg_elettrodomestici_2:
    name: Aggiornamento package elettrodomestici

####################################################
#                                                  #
#                    GROUP                         #
#                                                  #
####################################################

group:
  notifiche_elettrodomestici_2:
    entities:
      - input_boolean.notify_alexa_elettrodomestici_2
      - input_boolean.notify_push_elettrodomestici_2
      - automation.elettrodomestici_off_automatico_2
      - input_boolean.switch_elettrodomestici_2

####################################################
#                                                  #
#                INPUT DATETIME                    #
#                                                  #
####################################################

input_datetime:
  orario_inizio_notifiche_elettrodomestici_2:
    name: Orario Inizio Notifiche Elettrodomestici
    has_date: false
    has_time: true

  ####################################################

  orario_fine_notifiche_elettrodomestici_2:
    name: Orario Fine Notifiche Elettrodomestici
    has_date: false
    has_time: true

  ####################################################

  elettrodomestici_off_2:
    name: Elettrodomestici Off
    has_date: false
    has_time: true

####################################################
#                                                  #
#                INPUT TEXT                        #
#                                                  #
####################################################

input_text:
  data_reset_sensori_elettrodomestici_2:

  ####################################################

  nome_elettrodomestico_2:

  ####################################################

  messaggio_elettrodomestico_2:

  ####################################################

  ultimo_ciclo_attivo_elettrodomestici_2:

  ####################################################
  ####################################################

  lunedi_elettrodomestici_cicli_2:
  lunedi_elettrodomestici_tempo_2:

  ####################################################

  martedi_elettrodomestici_cicli_2:
  martedi_elettrodomestici_tempo_2:

  ####################################################

  mercoledi_elettrodomestici_cicli_2:
  mercoledi_elettrodomestici_tempo_2:

  ####################################################

  giovedi_elettrodomestici_cicli_2:
  giovedi_elettrodomestici_tempo_2:

  ####################################################

  venerdi_elettrodomestici_cicli_2:
  venerdi_elettrodomestici_tempo_2:

  ####################################################

  sabato_elettrodomestici_cicli_2:
  sabato_elettrodomestici_tempo_2:

  ####################################################

  domenica_elettrodomestici_cicli_2:
  domenica_elettrodomestici_tempo_2:

####################################################
#                                                  #
#                        SCRIPT                    #
#                                                  #
####################################################

script:
  reset_sensori_elettrodomestici_2:
    sequence:
      - service: input_text.set_value
        data:
          value: >-
            {{now().strftime('%d/%m/%Y %H:%M')}}
        target:
          entity_id: input_text.data_reset_sensori_elettrodomestici_2
      - service: utility_meter.calibrate
        data:
          value: "0"
        target:
          entity_id:
            - sensor.cicli_oggi_elettrodomestici_2
            - sensor.cicli_mese_elettrodomestici_2
            - sensor.cicli_anno_elettrodomestici_2
            - sensor.energy_oggi_elettrodomestici_2
            - sensor.energy_mese_elettrodomestici_2
            - sensor.energy_anno_elettrodomestici_2
            - sensor.elettrodomestici_tempo_oggi_2
            - sensor.elettrodomestici_tempo_mese_2
            - sensor.elettrodomestici_tempo_anno_2

      - service: input_number.set_value
        data:
          value: "0"
        target:
          entity_id:
            - input_number.lunedi_elettrodomestici_consumo_2
            - input_number.martedi_elettrodomestici_consumo_2
            - input_number.mercoledi_elettrodomestici_consumo_2
            - input_number.giovedi_elettrodomestici_consumo_2
            - input_number.venerdi_elettrodomestici_consumo_2
            - input_number.sabato_elettrodomestici_consumo_2
            - input_number.domenica_elettrodomestici_consumo_2
            - input_number.lunedi_elettrodomestici_costo_2
            - input_number.martedi_elettrodomestici_costo_2
            - input_number.mercoledi_elettrodomestici_costo_2
            - input_number.giovedi_elettrodomestici_costo_2
            - input_number.venerdi_elettrodomestici_costo_2
            - input_number.sabato_elettrodomestici_costo_2
            - input_number.domenica_elettrodomestici_costo_2

      - service: input_text.set_value
        data:
          value: "0"
        target:
          entity_id:
            - input_text.lunedi_elettrodomestici_cicli_2
            - input_text.martedi_elettrodomestici_cicli_2
            - input_text.mercoledi_elettrodomestici_cicli_2
            - input_text.giovedi_elettrodomestici_cicli_2
            - input_text.venerdi_elettrodomestici_cicli_2
            - input_text.sabato_elettrodomestici_cicli_2
            - input_text.domenica_elettrodomestici_cicli_2
            - input_text.lunedi_elettrodomestici_tempo_2
            - input_text.martedi_elettrodomestici_tempo_2
            - input_text.mercoledi_elettrodomestici_tempo_2
            - input_text.giovedi_elettrodomestici_tempo_2
            - input_text.venerdi_elettrodomestici_tempo_2
            - input_text.sabato_elettrodomestici_tempo_2
            - input_text.domenica_elettrodomestici_tempo_2

      - service: counter.reset
        target:
          entity_id:
            - counter.cicli_funzionamento_elettrodomestici_totale_2

####################################################
#                                                  #
#                    AUTOMAZIONI                   #
#                                                  #
####################################################

automation:
  - alias: Automazioni Elettrodomestici 2
    id: Automazioni Elettrodomestici 2
    mode: parallel
    trigger:
      - platform: state
        entity_id: binary_sensor.ac_elettrodomestici_2
        from: "off"
        to: "on"
        id: inizio_ciclo
      - platform: state
        entity_id: binary_sensor.ac_elettrodomestici_2
        from: "on"
        to: "off"
        id: fine_ciclo
      - platform: time
        at: "23:59:59"
        id: incremento_sensori_7_giorni_elettrodomestici
      - platform: state
        entity_id:
          - input_boolean.switch_elettrodomestici_2
          - *switch_elettrodomestici_2
        from: "on"
        to: "off"
        id: switch_off
      - platform: state
        entity_id:
          - input_boolean.switch_elettrodomestici_2
          - *switch_elettrodomestici_2
        from: "off"
        to: "on"
        id: switch_on
      - platform: template
        value_template: "{{ is_state('binary_sensor.ac_elettrodomestici_2','off') and is_state('input_boolean.durata_ciclo_attivo_elettrodomestici_2','on') }}"
        id: controllo_ciclo
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: incremento_sensori_7_giorni_elettrodomestici
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: >
                    {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
                    {% if (today in ["Monday"]) %} input_text.lunedi_elettrodomestici_cicli_2
                    {% elif (today in ["Tuesday"]) %} input_text.martedi_elettrodomestici_cicli_2
                    {% elif (today in ["Wednesday"]) %} input_text.mercoledi_elettrodomestici_cicli_2
                    {% elif (today in ["Thursday"]) %} input_text.giovedi_elettrodomestici_cicli_2
