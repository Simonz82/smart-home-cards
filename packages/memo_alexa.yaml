automation:
  - alias: "Memo Alexa 1 - Annuncio"
    id: memo_alexa_1_annuncio
    trigger:
      - platform: time
        at: input_datetime.memo_alexa_1_orario
        id: repeat
      - platform: time
        at: input_datetime.memo_alexa_1_data_singola
        id: once
    condition:
      - condition: state
        entity_id: input_boolean.memo_alexa_1_attivo
        state: "on"
      - condition: template
        value_template: "{{ states('input_text.memo_alexa_1_testo') | trim != '' }}"
      - condition: template
        value_template: >-
          {{ (trigger.id | default('repeat', true) == 'repeat'
              and is_state('input_boolean.memo_alexa_1_ripetizione', 'on')
              and states('input_datetime.memo_alexa_1_data_inizio') not in ['unknown','unavailable']
              and states('input_datetime.memo_alexa_1_data_fine') not in ['unknown','unavailable']
              and states('input_datetime.memo_alexa_1_data_inizio') <= now().strftime('%Y-%m-%d')
              and now().strftime('%Y-%m-%d') <= states('input_datetime.memo_alexa_1_data_fine'))
             or
             (trigger.id | default('repeat', true) == 'once'
              and is_state('input_boolean.memo_alexa_1_ripetizione', 'off')) }}
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ states('input_text.memo_alexa_1_persona') in ['', 'unknown', 'unavailable']
                     or is_state(states('input_text.memo_alexa_1_persona'), 'home') }}
            sequence:
              - service: script.notifica_vocale_alexa
                data:
                  messaggio: "{{ states('input_text.memo_alexa_1_testo') }}"
                  target: "{{ (states('input_text.memo_alexa_1_dispositivi') | trim).split(',') | map('trim') | reject('in', ['', 'unknown', 'unavailable']) | list }}"
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.memo_alexa_1_pending
        default:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.memo_alexa_1_pending
    mode: single

  - alias: "Memo Alexa 1 - Annuncio al rientro"
    id: memo_alexa_1_annuncio_rientro
    trigger:
      - platform: state
        entity_id:
          - person.residente_1
          - person.residente_2
          - person.residente_3
          - person.residente_4
          - person.tablet
          - person.auto
        to: "home"
    condition:
      - condition: state
        entity_id: input_boolean.memo_alexa_1_pending
        state: "on"
      - condition: state
        entity_id: input_boolean.memo_alexa_1_attivo
        state: "on"
      - condition: template
        value_template: "{{ trigger.entity_id == states('input_text.memo_alexa_1_persona') }}"
      - condition: template
        value_template: "{{ states('input_text.memo_alexa_1_testo') | trim != '' }}"
    action:
      - delay:
          minutes: "{{ states('input_number.memo_alexa_1_ritardo_rientro') | int(5) }}"
      - condition: state
        entity_id: input_boolean.memo_alexa_1_pending
        state: "on"
      - condition: template
        value_template: "{{ is_state(states('input_text.memo_alexa_1_persona'), 'home') }}"
      - service: script.notifica_vocale_alexa
        data:
          messaggio: "{{ states('input_text.memo_alexa_1_testo') }}"
          target: "{{ (states('input_text.memo_alexa_1_dispositivi') | trim).split(',') | map('trim') | reject('in', ['', 'unknown', 'unavailable']) | list }}"
      - service: input_boolean.turn_off
