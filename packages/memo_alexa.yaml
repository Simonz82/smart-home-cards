####################################################
#                                                  #
#   Memo Alexa - fino a 4 note testuali            #
#   indipendenti (la card Memo 1 permette di       #
#   sbloccarne altre in base all'esigenza),        #
#   ciascuna con proprio intervallo di date        #
#   (inizio/fine) e orario di annuncio, oppure      #
#   una singola data/ora se non ripetuta. Quando   #
#   attiva e la finestra e' valida, il messaggio   #
#   viene annunciato su Alexa (sui dispositivi      #
#   scelti, o su quello di default) riusando lo    #
#   script condiviso di centro_notifiche_alexa.yaml.#
#                                                  #
#   Campo "Persona": se impostato, se all'orario   #
#   previsto la persona non e' in casa, l'annuncio #
#   NON viene perso: resta "in sospeso" e viene    #
#   fatto pochi minuti dopo il suo rientro.         #
#                                                  #
####################################################

