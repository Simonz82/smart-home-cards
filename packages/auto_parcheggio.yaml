# PRIMA DI USARE (guida con tutti i passi: docs/auto-parcheggiata.md)
# 1) Metti questo file in /config/packages/auto_parcheggio.yaml (in configuration.yaml: homeassistant: packages: !include_dir_named packages).
# 2) Cerca e sostituisci "persona1" con il nome del tuo telefono = la parte tra "sensor." e "_bluetooth_connection"
#    (Impostazioni > Dispositivi e servizi > Entita', cerca bluetooth_connection; es. sensor.pixel_8_bluetooth_connection -> pixel_8).
#    Hai altri telefoni? Fai lo stesso con persona2 e persona3. Con un solo telefono lasciali pure: non danno fastidio.
# 3) Riavvio COMPLETO di Home Assistant (il ricaricamento non crea gli helper).
# 4) Aggiungi la card (type: custom:shc-parking-card, car: 1) e dall'ingranaggio imposta persona associata (lo stesso nome del telefono) e nome Bluetooth dell'auto.
# Serve l'app Companion Android con il sensore "Bluetooth connection" acceso (su iPhone funziona solo il pulsante manuale).
# Come capisce che sei in auto (per auto, helper input_select ..._rilevamento, dall'ingranaggio): bluetooth (default), android_auto (sensore Android Auto dell'app Companion),
# carplay_comandi (iPhone: un Comando dell'app Comandi chiama script.auto_parcheggio_salva con metodo carplay) o solo_manuale.
# Dove ho parcheggiato l'auto (card shc-parking-card di smart-home-cards): fino a 3 auto, ognuna con la sua posizione.
# Ogni card e' legata a un'auto (car: 1, 2 o 3 nella card). Per ogni auto ci sono helper separati
# (input_*.auto_parcheggio_auto<N>_*): posizione, indirizzo, foto, nome dell'auto, nome Bluetooth, persona associata
# (nome della persona, es. "persona1"), notifica si/no, rilevamento da attivita' e soglia di precisione GPS.
# Si modificano dall'ingranaggio della card. Tutto e' ripristinato da HA al riavvio (nessun "initial").
# Metodo: quando il nome Bluetooth dell'auto N sparisce dai dispositivi collegati (attributo connected_paired_devices del
# sensore sensor.<persona>_bluetooth_connection del telefono associato) si chiede al telefono una posizione fresca, si scarta
# se il GPS e' impreciso e si salva sull'auto N. Fuori dal Bluetooth: uscita dall'attivita' "in_vehicle" (opzionale, spenta di
# default perche' vale anche per bus e treno) e pulsante manuale della card. Le notifiche vanno alla persona associata all'auto.
# Telefoni gestiti qui: persona1, persona2, persona3. Per aggiungerne altri: un trigger in auto_parcheggio_bluetooth (id = nome della persona,
# sensor.<nome>_bluetooth_connection) e, per l'attivita', un trigger in auto_parcheggio_attivita.
# Dopo la prima installazione imposta dall'ingranaggio: persona associata, nome Bluetooth, nome dell'auto, notifica e soglia (60 m).

