          photo: "{{ states('input_text.auto_parcheggio_auto3_foto') if states('input_text.auto_parcheggio_auto3_foto') not in ['unknown', 'unavailable'] else '' }}"

script:
  # Legge una posizione fresca del telefono (max 3 tentativi) e la restituisce come risposta.
  # Le variabili dei blocchi annidati non escono dal blocco: per questo il risultato esce con "stop".
  auto_parcheggio_leggi:
    alias: Auto parcheggio - leggi posizione telefono
    icon: mdi:crosshairs-gps
    mode: parallel
    max: 4
    fields:
      persona:
        description: nome del telefono (come in device_tracker.<nome>)
        required: true
        example: persona1
        selector:
          text:
      scarta_se_impreciso:
        description: se vero il risultato ok e' falso quando il GPS supera la soglia
        default: false
        selector:
          boolean:
      soglia:
        description: soglia di precisione in metri
        default: 60
        selector:
          number:
            min: 5
            max: 500
    sequence:
      - variables:
          p: "{{ persona | default('persona1') }}"
          scarta: "{{ scarta_se_impreciso | default(false) }}"
          tracker: "device_tracker.{{ p }}"
          limite: "{{ soglia | default(60) | float(60) }}"
      # a casa: coordinate della zona Casa (il GPS al chiuso e' impreciso e darebbe un falso punto)
      - if:
          - condition: template
            value_template: "{{ is_state(tracker, 'home') or ('person.' ~ p) in (state_attr('zone.home', 'persons') | default([], true)) }}"
        then:
          - variables:
              out:
                ok: true
                casa: true
                lat: "{{ state_attr('zone.home', 'latitude') | float(0) }}"
                lon: "{{ state_attr('zone.home', 'longitude') | float(0) }}"
                acc: 0
          - stop: A casa
            response_variable: out
      - repeat:
          count: 3
          sequence:
            - variables:
                inizio: "{{ now() }}"
            - action: "notify.mobile_app_{{ p }}"
              data:
                message: request_location_update
            # aspetta che il tracker si aggiorni (se le coordinate non cambiano non arriva nulla: dopo 25 s si va avanti)
            - wait_template: "{{ states[tracker].last_updated > inizio }}"
              timeout: "00:00:25"
              continue_on_timeout: true
            - delay: "00:00:04"
            - variables:
                lat: "{{ state_attr(tracker, 'latitude') | float(0) }}"
                lon: "{{ state_attr(tracker, 'longitude') | float(0) }}"
                acc: "{{ state_attr(tracker, 'gps_accuracy') | float(9999) }}"
                out:
                  ok: "{{ lat != 0 and (acc <= limite or not scarta) }}"
                  casa: false
                  lat: "{{ lat }}"
                  lon: "{{ lon }}"
                  acc: "{{ acc }}"
            - if:
                - condition: template
                  value_template: "{{ out.ok }}"
              then:
                - stop: Posizione ok
                  response_variable: out
      # tentativi finiti senza una posizione precisa: ultimo valore letto, ok falso
      - variables:
          out:
            ok: false
            casa: false
            lat: "{{ state_attr(tracker, 'latitude') | float(0) }}"
            lon: "{{ state_attr(tracker, 'longitude') | float(0) }}"
            acc: "{{ state_attr(tracker, 'gps_accuracy') | float(9999) }}"
      - stop: GPS impreciso
        response_variable: out

  auto_parcheggio_salva:
    alias: Auto parcheggio - salva posizione
    description: >-
      Legge la posizione del telefono, scarta se il GPS e' impreciso (solo automatico) e salva la posizione
      dell'auto indicata (1, 2 o 3). A casa usa le coordinate della zona Casa. Il manuale salva sempre.
      La notifica va alla persona associata all'auto (se la notifica dell'auto e' accesa).
    icon: mdi:car-brake-parking
    mode: queued
    max: 6
    fields:
      auto:
        description: numero dell'auto (1, 2 o 3)
        default: 1
        selector:
          number:
            min: 1
            max: 3
      persona:
        description: nome della persona il cui telefono da' la posizione (default la persona associata all'auto)
        example: persona1
        selector:
          text:
      metodo:
        description: bluetooth, android_auto, carplay, attivita o manuale (carplay si usa da un Comando iPhone)
        default: manuale
        selector:
          select:
            options:
              - bluetooth
              - android_auto
              - carplay
              - attivita
              - manuale
      scarta_se_impreciso:
        description: se vero (automatico) non salva con GPS impreciso; il manuale salva sempre
        default: false
        selector:
          boolean:
    sequence:
      - variables:
          a: "{{ auto | default(1) | int(1) }}"
          pre: "auto_parcheggio_auto{{ a }}_"
          assoc: "{{ states('input_text.auto_parcheggio_auto' ~ a ~ '_persona') | replace('unknown', '') | replace('unavailable', '') | trim | lower }}"
          # telefono che da' la posizione: quello indicato, altrimenti la persona associata all'auto
          p: "{{ (persona | default('', true) | string | trim | lower) or assoc }}"
          # chi riceve la notifica: la persona associata all'auto, altrimenti chi ha dato la posizione
          dest: "{{ assoc or p }}"
          m: "{{ metodo | default('manuale') }}"
          geo: "sensor.{{ p }}_geocoded_location"
          nome: "{{ state_attr('person.' ~ p, 'friendly_name') | default(p, true) | title }}"
          nome_auto: "{{ states('input_text.auto_parcheggio_auto' ~ a ~ '_nome') | replace('unknown', '') | replace('unavailable', '') | trim }}"
          soglia: "{{ states('input_number.auto_parcheggio_auto' ~ a ~ '_soglia_precisione') | float(60) }}"
          notifica: "{{ is_state('input_boolean.auto_parcheggio_auto' ~ a ~ '_notifica', 'on') }}"
      - if:
          - condition: template
            value_template: "{{ p == '' }}"
        then:
          - stop: Nessuna persona associata all'auto
      - action: script.auto_parcheggio_leggi
        data:
          persona: "{{ p }}"
          scarta_se_impreciso: "{{ scarta_se_impreciso | default(false) }}"
          soglia: "{{ soglia }}"
        response_variable: pos
      # il sensore indirizzo dell'app si aggiorna poco dopo la posizione
      - delay: "00:00:05"
      - variables:
          salva: "{{ pos.ok and pos.lat != 0 }}"
          lat: "{{ pos.lat }}"
          lon: "{{ pos.lon }}"
          acc: "{{ pos.acc }}"
          loc: "{{ state_attr(geo, 'location') }}"
          indirizzo: >-
            {% if pos.casa %}Casa
            {% elif loc is iterable and loc is not string and loc | length == 2 and (loc[0] | float(0) - pos.lat) | abs < 0.002 and (loc[1] | float(0) - pos.lon) | abs < 0.002 and states(geo) not in ['unknown', 'unavailable', 'None', ''] %}{{ states(geo) }}{% endif %}
      - if:
          - condition: template
            value_template: "{{ salva }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: "input_number.{{ pre }}lat"
            data:
              value: "{{ lat }}"
          - action: input_number.set_value
            target:
              entity_id: "input_number.{{ pre }}lon"
            data:
              value: "{{ lon }}"
          - action: input_number.set_value
            target:
              entity_id: "input_number.{{ pre }}precisione"
            data:
              value: "{{ [acc, 5000] | min }}"
          - action: input_text.set_value
            target:
              entity_id: "input_text.{{ pre }}indirizzo"
            data:
              value: "{{ (indirizzo | string | trim)[:250] }}"
          - action: input_text.set_value
            target:
              entity_id: "input_text.{{ pre }}chi"
            data:
              value: "{{ nome }}"
          - action: input_text.set_value
            target:
              entity_id: "input_text.{{ pre }}metodo"
            data:
              value: "{{ m }}"
          # l'ora per ultima: la card considera la posizione completa quando cambia questa
          - action: input_datetime.set_datetime
            target:
              entity_id: "input_datetime.{{ pre }}quando"
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          # notifica alla persona associata all'auto, solo se l'interruttore dell'auto e' acceso
          - if:
              - condition: template
                value_template: "{{ notifica and dest != '' }}"
            then:
              - action: "notify.mobile_app_{{ dest }}"
                data:
                  title: "{{ 'Auto parcheggiata' ~ (': ' ~ nome_auto if nome_auto else '') }}"
                  message: "{{ indirizzo | string | trim if indirizzo | string | trim != '' else 'Posizione salvata' }}. Tocca per navigare."
                  data:
                    tag: "auto_parcheggio_{{ a }}"
                    clickAction: "https://www.google.com/maps/dir/?api=1&destination={{ lat }},{{ lon }}&travelmode=walking"
                    url: "https://www.google.com/maps/dir/?api=1&destination={{ lat }},{{ lon }}&travelmode=walking"
        else:
          # una sola notifica informativa, nessun allarme (solo se la notifica dell'auto e' accesa)
          - if:
              - condition: template
                value_template: "{{ notifica and dest != '' }}"
            then:
              - action: "notify.mobile_app_{{ dest }}"
                data:
                  title: "{{ 'Auto parcheggio non salvato' ~ (': ' ~ nome_auto if nome_auto else '') }}"
                  message: "GPS troppo impreciso ({{ acc | round(0) }} m). Premi Registra posizione dalla card quando sei all'aperto."
                  data:
                    tag: "auto_parcheggio_errore_{{ a }}"

automation:
  - id: auto_parcheggio_bluetooth
    alias: auto_parcheggio_bluetooth
    description: Il nome Bluetooth di un'auto (input_text.auto_parcheggio_auto<N>_bt) sparisce dal telefono della persona associata -> salva la posizione su quell'auto
    mode: parallel
    max: 6
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.persona1_bluetooth_connection
        id: persona1
        not_from:
          - unknown
          - unavailable
        not_to:
          - unknown
          - unavailable
      - trigger: state
        entity_id: sensor.persona2_bluetooth_connection
        id: persona2
        not_from:
          - unknown
          - unavailable
        not_to:
          - unknown
          - unavailable
      - trigger: state
        entity_id: sensor.persona3_bluetooth_connection
        id: persona3
        not_from:
          - unknown
          - unavailable
        not_to:
          - unknown
          - unavailable
    # auto N di cui il telefono si e' appena scollegato (0 = nessuna). Si guarda from/to dell'evento, non uno stato locale: regge reload e riavvio.
    variables:
      auto: >-
        {% set ns = namespace(a=0) %}
        {% set prima = (trigger.from_state.attributes.connected_paired_devices | default([]) + trigger.from_state.attributes.connected_not_paired_devices | default([])) | join('|') | lower %}
        {% set dopo = (trigger.to_state.attributes.connected_paired_devices | default([]) + trigger.to_state.attributes.connected_not_paired_devices | default([])) | join('|') | lower %}
        {% for n in [1, 2, 3] %}
        {% if ns.a == 0 and (states('input_text.auto_parcheggio_auto' ~ n ~ '_persona') | trim | lower) == trigger.id and states('input_select.auto_parcheggio_auto' ~ n ~ '_rilevamento') in ['bluetooth', 'unknown', 'unavailable', ''] %}
        {% set nomi = states('input_text.auto_parcheggio_auto' ~ n ~ '_bt').split(',') | map('trim') | reject('eq', '') | map('lower') | list %}
        {% if nomi | length > 0 and nomi | select('in', prima) | list | length > 0 and nomi | select('in', dopo) | list | length == 0 %}{% set ns.a = n %}{% endif %}
        {% endif %}
        {% endfor %}
        {{ ns.a }}
    conditions:
      - condition: template
        value_template: "{{ auto | int(0) > 0 }}"
    actions:
      # evita i falsi distacchi brevi (avviamento motore, sbalzi): deve restare scollegato 20 s
      - delay: "00:00:20"
      - condition: template
        value_template: >-
          {% set nomi = states('input_text.auto_parcheggio_auto' ~ (auto | int(0)) ~ '_bt').split(',') | map('trim') | reject('eq', '') | map('lower') | list %}
          {% set s = states.sensor[trigger.id ~ '_bluetooth_connection'] %}
          {% set ora = (s.attributes.connected_paired_devices | default([]) + s.attributes.connected_not_paired_devices | default([])) | join('|') | lower %}
          {{ nomi | select('in', ora) | list | length == 0 }}
      # niente doppioni sulla stessa auto negli ultimi 3 minuti
      - condition: template
        value_template: "{{ (now() | as_timestamp - as_timestamp(states('input_datetime.auto_parcheggio_auto' ~ (auto | int(0)) ~ '_quando'), 0)) > 180 }}"
      - action: script.auto_parcheggio_salva
        data:
          auto: "{{ auto | int(0) }}"
          persona: "{{ trigger.id }}"
          metodo: bluetooth
          scarta_se_impreciso: true

  - id: auto_parcheggio_attivita
    alias: auto_parcheggio_attivita
    description: Uscita dall'attivita' in_vehicle (interruttore input_boolean.auto_parcheggio_auto<N>_usa_attivita) -> salva la posizione sull'auto associata alla persona
    mode: parallel
    max: 4
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.persona1_detected_activity
        id: persona1
        from: in_vehicle
        for: "00:01:00"
    variables:
      auto: >-
        {% set ns = namespace(a=0) %}
        {% for n in [1, 2, 3] %}
        {% if ns.a == 0 and (states('input_text.auto_parcheggio_auto' ~ n ~ '_persona') | trim | lower) == trigger.id and is_state('input_boolean.auto_parcheggio_auto' ~ n ~ '_usa_attivita', 'on') %}{% set ns.a = n %}{% endif %}
        {% endfor %}
        {{ ns.a }}
    conditions:
      - condition: template
        value_template: "{{ auto | int(0) > 0 }}"
    actions:
      # "from + for" non regge uno scollegamento breve: serve che l'attivita' sia davvero cambiata e che non sia tornata in auto
      - condition: template
        value_template: "{{ not is_state('sensor.' ~ trigger.id ~ '_detected_activity', ['in_vehicle', 'unknown', 'unavailable']) }}"
      - condition: template
        value_template: "{{ (now() | as_timestamp - as_timestamp(states('input_datetime.auto_parcheggio_auto' ~ (auto | int(0)) ~ '_quando'), 0)) > 180 }}"
      - action: script.auto_parcheggio_salva
        data:
          auto: "{{ auto | int(0) }}"
          persona: "{{ trigger.id }}"
          metodo: attivita
          scarta_se_impreciso: true

  - id: auto_parcheggio_android_auto
    alias: auto_parcheggio_android_auto
    description: Il telefono si scollega da Android Auto (binary_sensor.<telefono>_android_auto da on a off) -> salva la posizione sull'auto associata che ha rilevamento = android_auto
    mode: parallel
    max: 4
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.persona1_android_auto
        id: persona1
        from: "on"
        to: "off"
      - trigger: state
        entity_id: binary_sensor.persona2_android_auto
        id: persona2
        from: "on"
        to: "off"
      - trigger: state
        entity_id: binary_sensor.persona3_android_auto
        id: persona3
        from: "on"
        to: "off"
    variables:
      auto: >-
        {% set ns = namespace(a=0) %}
        {% for n in [1, 2, 3] %}
        {% if ns.a == 0 and (states('input_text.auto_parcheggio_auto' ~ n ~ '_persona') | trim | lower) == trigger.id and is_state('input_select.auto_parcheggio_auto' ~ n ~ '_rilevamento', 'android_auto') %}{% set ns.a = n %}{% endif %}
        {% endfor %}
        {{ ns.a }}
    conditions:
      - condition: template
        value_template: "{{ auto | int(0) > 0 }}"
    actions:
      # evita i falsi distacchi brevi: deve restare scollegato 20 s
      - delay: "00:00:20"
      - condition: template
        value_template: "{{ is_state('binary_sensor.' ~ trigger.id ~ '_android_auto', 'off') }}"
      # niente doppioni sulla stessa auto negli ultimi 3 minuti
      - condition: template
        value_template: "{{ (now() | as_timestamp - as_timestamp(states('input_datetime.auto_parcheggio_auto' ~ (auto | int(0)) ~ '_quando'), 0)) > 180 }}"
      - action: script.auto_parcheggio_salva
        data:
          auto: "{{ auto | int(0) }}"
          persona: "{{ trigger.id }}"
          metodo: android_auto
          scarta_se_impreciso: true
