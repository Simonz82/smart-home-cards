template:
  - sensor:
      - name: Auto parcheggio auto1 posizione
        unique_id: auto_parcheggio_auto1_posizione
        icon: mdi:car-brake-parking
        device_class: timestamp
        # senza prima registrazione (latitudine al minimo -90) il sensore e' non disponibile: la card mostra "nessuna posizione"
        availability: "{{ is_number(states('input_number.auto_parcheggio_auto1_lat')) and states('input_number.auto_parcheggio_auto1_lat') | float(-90) > -89.9 }}"
        state: "{{ as_datetime(states('input_datetime.auto_parcheggio_auto1_quando')).replace(tzinfo=now().tzinfo).isoformat() }}"
        attributes:
          latitude: "{{ states('input_number.auto_parcheggio_auto1_lat') | float(0) }}"
          longitude: "{{ states('input_number.auto_parcheggio_auto1_lon') | float(0) }}"
          gps_accuracy: "{{ states('input_number.auto_parcheggio_auto1_precisione') | float(0) }}"
          address: "{{ states('input_text.auto_parcheggio_auto1_indirizzo') }}"
          by: "{{ states('input_text.auto_parcheggio_auto1_chi') }}"
          method: "{{ states('input_text.auto_parcheggio_auto1_metodo') }}"
          photo: "{{ states('input_text.auto_parcheggio_auto1_foto') if states('input_text.auto_parcheggio_auto1_foto') not in ['unknown', 'unavailable'] else '' }}"
      - name: Auto parcheggio auto2 posizione
        unique_id: auto_parcheggio_auto2_posizione
        icon: mdi:car-brake-parking
        device_class: timestamp
        # senza prima registrazione (latitudine al minimo -90) il sensore e' non disponibile: la card mostra "nessuna posizione"
        availability: "{{ is_number(states('input_number.auto_parcheggio_auto2_lat')) and states('input_number.auto_parcheggio_auto2_lat') | float(-90) > -89.9 }}"
        state: "{{ as_datetime(states('input_datetime.auto_parcheggio_auto2_quando')).replace(tzinfo=now().tzinfo).isoformat() }}"
        attributes:
          latitude: "{{ states('input_number.auto_parcheggio_auto2_lat') | float(0) }}"
          longitude: "{{ states('input_number.auto_parcheggio_auto2_lon') | float(0) }}"
          gps_accuracy: "{{ states('input_number.auto_parcheggio_auto2_precisione') | float(0) }}"
          address: "{{ states('input_text.auto_parcheggio_auto2_indirizzo') }}"
          by: "{{ states('input_text.auto_parcheggio_auto2_chi') }}"
          method: "{{ states('input_text.auto_parcheggio_auto2_metodo') }}"
          photo: "{{ states('input_text.auto_parcheggio_auto2_foto') if states('input_text.auto_parcheggio_auto2_foto') not in ['unknown', 'unavailable'] else '' }}"
      - name: Auto parcheggio auto3 posizione
        unique_id: auto_parcheggio_auto3_posizione
        icon: mdi:car-brake-parking
