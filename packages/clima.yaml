# /config/packages/clima.yaml
#
# Programmazione una tantum del climatizzatore per la card shc-climate-card
# (smart-home-cards): accensione a un orario con modalita' e temperatura
# scelte, spegnimento a un orario. Dopo essere scattate si disattivano da sole.
#
# DA CAMBIARE: cerca climate.daikin_salone_temperature e metti il tuo
# climatizzatore (Impostazioni -> Entita' -> cerca "climate.").

# ---------------------------------------------------------------------------------
# HELPERS PER LA PROGRAMMAZIONE DEL CLIMATIZZATORE DEL SALONE
# ---------------------------------------------------------------------------------

input_boolean:
  # Ventola regolata da sola in base a quanto manca alla temperatura impostata.
  # E' l'interruttore del pulsante "Ventola automatica" della card (fan_auto_entity).
  # Niente "initial": dopo un riavvio resta com'era.
  clima_salone_ventola_automatica:
    name: Ventola Automatica Clima Salone
    icon: mdi:fan-auto

  # Abilita la programmazione di accensione una tantum
  clima_salone_programmazione_attiva:
    name: Abilita Programmazione Clima Salone
    icon: mdi:calendar-clock

  # Abilita la programmazione di spegnimento una tantum
  clima_salone_programmazione_spegnimento_attiva:
    name: Abilita Spegnimento Programmato Clima Salone
    icon: mdi:calendar-remove

input_datetime:
  # Orario di accensione programmata
  clima_salone_orario_accensione:
    name: Orario Accensione Clima Salone
    has_date: false
    has_time: true
    icon: mdi:clock-outline

  # Orario di spegnimento programmato
  clima_salone_orario_spegnimento:
    name: Orario Spegnimento Clima Salone
    has_date: false
    has_time: true
    icon: mdi:clock-end

input_select:
  # Modalità con cui accendere il climatizzatore
  clima_salone_modalita_accensione:
    name: Modalità Accensione Clima Salone
    options:
      - "cool"
      - "heat"
      - "heat_cool"
      - "off"
    initial: "cool"
    icon: mdi:air-conditioner

input_number:
  # Temperatura da impostare all'accensione programmata
  clima_salone_temperatura_accensione:
    name: Temperatura Accensione Clima Salone
    initial: 26
    min: 18
    max: 32
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer

# ---------------------------------------------------------------------------------
# AUTOMAZIONI
# ---------------------------------------------------------------------------------

automation:
  # -------------------------------------------------------------------------------
  # ACCENSIONE PROGRAMMATA UNA TANTUM
  # -------------------------------------------------------------------------------
  - alias: "Climatizzatore Salone - Accensione Programmata (Una Tantum)"
    id: "climatizzatore_salone_accensione_programmata"
    description: "Accende il clima del salone e poi disattiva la programmazione per evitare ripetizioni."

    triggers:
      - trigger: time
        at: input_datetime.clima_salone_orario_accensione

    conditions:
      - condition: state
        entity_id: input_boolean.clima_salone_programmazione_attiva
        state: "on"

    actions:
      # Se la modalità scelta è OFF, spegne il clima
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.clima_salone_modalita_accensione
                state: "off"
            sequence:
              - action: climate.turn_off
                target:
                  entity_id: climate.daikin_salone_temperature

        # In tutti gli altri casi imposta modalità e temperatura
        default:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.daikin_salone_temperature
            data:
              hvac_mode: "{{ states('input_select.clima_salone_modalita_accensione') }}"

          - action: climate.set_temperature
            target:
              entity_id: climate.daikin_salone_temperature
            data:
              temperature: "{{ states('input_number.clima_salone_temperatura_accensione') | float }}"

      # Alla fine spegne il flag per rendere la programmazione una tantum
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.clima_salone_programmazione_attiva

    mode: single

  # -------------------------------------------------------------------------------
  # SPEGNIMENTO PROGRAMMATO UNA TANTUM
  # -------------------------------------------------------------------------------
  - alias: "Climatizzatore Salone - Spegnimento Programmato (Una Tantum)"
    id: "climatizzatore_salone_spegnimento_programmato"
    description: "Spegne il clima del salone e poi disattiva la programmazione per evitare ripetizioni."

    triggers:
      - trigger: time
        at: input_datetime.clima_salone_orario_spegnimento

    conditions:
      - condition: state
        entity_id: input_boolean.clima_salone_programmazione_spegnimento_attiva
        state: "on"

    actions:
      # Spegne il climatizzatore
      - action: climate.turn_off
        target:
          entity_id: climate.daikin_salone_temperature

      # Disattiva il flag per rendere la programmazione una tantum
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.clima_salone_programmazione_spegnimento_attiva

    mode: single

  # -------------------------------------------------------------------------------
  # VENTOLA IN BASE ALLA TEMPERATURA
  # La Daikin in "auto" tiene la ventola alta anche a temperatura raggiunta.
  # Qui la ventola segue quanto manca alla temperatura impostata:
  #   manca 1 grado o più  -> auto (spinge)
  #   manca meno di 1 grado -> velocità 3
  #   raggiunta o superata  -> velocità 2 (quiet non scalda abbastanza)
  # Stanza = sensore di temperatura del salone (DA CAMBIARE: sensor.temperatura_salone);
  #   se non risponde, il sensore del climatizzatore.
  # Cambia la ventola solo quando serve (le chiamate al cloud Daikin sono limitate).
  # -------------------------------------------------------------------------------
  - alias: "Climatizzatore Salone - Ventola in base alla temperatura"
    id: "climatizzatore_salone_ventola_temperatura"
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: sensor.temperatura_salone
      - trigger: state
        entity_id: climate.daikin_salone_temperature
      - trigger: state
        entity_id: climate.daikin_salone_temperature
        attribute: temperature
      - trigger: state
        entity_id: input_boolean.clima_salone_ventola_automatica
        to: "on"
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.clima_salone_ventola_automatica
        state: "on"
      - condition: state
        entity_id: climate.daikin_salone_temperature
        state: ["heat", "cool"]
    actions:
      - variables:
          clima: climate.daikin_salone_temperature
          modo: "{{ states(clima) }}"
          target: "{{ state_attr(clima, 'temperature') | float(0) }}"
          stanza: >-
            {% set z = states('sensor.temperatura_salone') %}
            {{ z | float if is_number(z) else state_attr(clima, 'current_temperature') | float(0) }}
          manca: "{{ (target - stanza) if modo == 'heat' else (stanza - target) }}"
          ventola: "{{ 'auto' if manca >= 1 else ('3' if manca > 0 else '2') }}"
      - condition: template
        value_template: "{{ target > 0 and stanza > 0 and state_attr(clima, 'fan_mode') != ventola }}"
      - action: climate.set_fan_mode
        target:
          entity_id: "{{ clima }}"
        data:
          fan_mode: "{{ ventola }}"
