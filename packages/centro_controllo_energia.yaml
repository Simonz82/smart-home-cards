# ==============================================================================
#  CONTROLLO ENERGIA CASA - package Home Assistant
#  Autore: Simonz82  ·  https://github.com/Simonz82/controllo_energia_casa
#
#  Backend della card "controllo-energia-casa-card": contatori di energia per
#  periodo (ora / oggi / settimana / mese / bimestre / anno), costi, media dei
#  giorni, soglia di allarme con notifiche (Push, Alexa, Telegram, ognuna con il
#  suo interruttore), le 4 barre della card scelte da menu a tendina e il sensore
#  "Top Consumo Elettrico".
#
#  COSA DEVI ADATTARE (cerca queste righe nel file):
#   1. "Sensore Consumo Generale W"   -> il tuo sensore di potenza totale (W)
#   2. media_player Alexa             -> i tuoi speaker (o togli il ramo Alexa)
#   3. notify.mobile_app_*            -> i tuoi telefoni
#   4. telegram chat_id 111111111... -> i tuoi ID Telegram (o togli il ramo).
#      Con piu' di un bot Telegram aggiungi anche "config_entry_id" alle azioni.
#
#  Dopo aver copiato il file in /config/packages/: Strumenti per sviluppatori ->
#  Controlla configurazione -> riavvia Home Assistant.
# ==============================================================================

homeassistant:
  customize:
    package.node_anchors:
      customize: &customize
        package: "Controllo Energia Casa"
        setting:

        ####################################################
        #                                                  #
        #            IMPOSTAZIONI PACKAGE                  #
        #                                                  #
        ####################################################

        Sensore Consumo Generale W: &power "{{ states('sensor.generale_power') }}"

        ####################################################

        Media Player Alexa 1: &alexa1 media_player.il_tuo_echo_1
        Media Player Alexa 2: &alexa2 media_player.il_tuo_echo_2

####################################################
#                                                  #
#                INPUT NUMBER                      #
#                                                  #
####################################################

input_number:
  costo_energia_casa:
    name: Costo Energia Casa
    min: 0.000
    max: 99999.000
    unit_of_measurement: "€"
    step: 0.01
    mode: box
    icon: mdi:currency-eur

  ####################################################

  soglia_lavoro_casa_w:
    name: Soglia Lavoro Casa W
    icon: mdi:flash
    min: 1
    max: 9000
    step: 1.00
    unit_of_measurement: "w"
    mode: box

  ####################################################

  ritardo_superamento_soglia:
    name: Ritardo Superamento Soglia
    mode: box
    icon: mdi:timelapse
    unit_of_measurement: "sec"
    min: 10
    max: 360
    step: 1

  ####################################################
  #                                                  #
  #            INPUT NUMBER KWH CONSUMATI            #
  #                                                  #
  ####################################################

  kwh_consumati_lunedi:
    name: Kwh Consumati Lunedì
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: Kwh

  ####################################################

  kwh_consumati_martedi:
    name: Kwh Consumati Martedì
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: Kwh

  ####################################################

  kwh_consumati_mercoledi:
    name: Kwh Consumati Mercoledì
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: Kwh

  ####################################################

  kwh_consumati_giovedi:
    name: Kwh Consumati Giovedì
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: Kwh

  ####################################################

  kwh_consumati_venerdi:
    name: Kwh Consumati Venerdì
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: Kwh

  ####################################################

  kwh_consumati_sabato:
    name: Kwh Consumati Sabato
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: Kwh

  ####################################################

  kwh_consumati_domenica:
    name: Kwh Consumati Domenica
    icon: mdi:counter
    min: 0
    max: 999999
    mode: box
    unit_of_measurement: Kwh

  ####################################################
  #  SCALE DELLE 4 BARRE DELLA CARD (valore = 100%)  #
  #  Imposta il valore una volta dopo l'installazione #
  #  (es. la potenza massima del tuo contatore).     #
  ####################################################

  scala_barra_1:
    name: Scala Barra 1
    icon: mdi:ruler
    min: 500
    max: 15000
    step: 100
    unit_of_measurement: W
    mode: box

  scala_barra_2:
    name: Scala Barra 2
    icon: mdi:ruler
    min: 500
    max: 15000
    step: 100
    unit_of_measurement: W
    mode: box

  scala_barra_3:
    name: Scala Barra 3
    icon: mdi:ruler
    min: 500
    max: 15000
    step: 100
    unit_of_measurement: W
    mode: box

  scala_barra_4:
    name: Scala Barra 4
    icon: mdi:ruler
    min: 500
    max: 15000
    step: 100
    unit_of_measurement: W
    mode: box

####################################################
#                                                  #
#                    GROUP                         #
#                                                  #
####################################################

group:
  notifiche_soglia_elettrica:
    entities:
      - input_boolean.notify_alexa_soglia
      - input_boolean.notify_push_soglia
      - input_boolean.notify_telegram_soglia
      - input_boolean.notify_push_costi_giornalieri
      - input_boolean.notify_push_costi_mensili
      - input_boolean.notify_push_costi_annuali

####################################################
#                                                  #
#                INPUT BOOLEAN                     #
#                                                  #
####################################################

input_boolean:
  notify_push_soglia:
    name: Notifica Push

  ####################################################

  notify_push_costi_giornalieri:
    name: Notifica Push Costi Giornalieri

  notify_push_costi_mensili:
    name: Notifica Push Costi Mensili

  notify_push_costi_annuali:
    name: Notifica Push Costi Annuali

  ####################################################

  notify_alexa_soglia:
    name: Notifica Alexa Soglia

  ####################################################

  # Se spento, il superamento soglia NON invia il messaggio Telegram
  # (Push e Alexa restano gestiti dai loro flag).
  notify_telegram_soglia:
    name: Notifica Telegram Soglia

####################################################
#                                                  #
#                  UTILITY METER                   #
#                                                  #
####################################################

utility_meter:
  energia_ogni_ora_casa:
    source: sensor.w_kwh_casa
    cycle: hourly

  ####################################################

  energia_oggi_casa:
    source: sensor.w_kwh_casa
    cycle: daily

  ####################################################

  energia_settimana_casa:
    source: sensor.w_kwh_casa
    cycle: weekly

  ####################################################

  energia_mese_casa:
    source: sensor.w_kwh_casa
    cycle: monthly

  ####################################################

  energia_bimestre_casa:
    source: sensor.w_kwh_casa
    cycle: bimonthly

  ####################################################

  energia_anno_casa:
    source: sensor.w_kwh_casa
    cycle: yearly

####################################################
#                                                  #
#                TEMPLATE (MIGRATO)                #
#                                                  #
####################################################

template:
  - sensor:
      # OLD: sensor.sensore_potenza_casa_w
      - name: Sensore Potenza Casa W
        unit_of_measurement: "W"
        icon: mdi:flash
        state: *power
        default_entity_id: sensor.sensore_potenza_casa_w # Mantiene ID per utility_meter

      # OLD: sensor.media_settimanale_kwh_consumati
      - name: Media Settimanale Kwh Consumati
        unit_of_measurement: "Kwh"
        state: >-
          {{ (((states('input_number.kwh_consumati_lunedi')|float(default=0)) +
          (states('input_number.kwh_consumati_martedi')|float(default=0)) +
          (states('input_number.kwh_consumati_mercoledi')|float(default=0)) +
          (states('input_number.kwh_consumati_giovedi')|float(default=0)) +
          (states('input_number.kwh_consumati_venerdi')|float(default=0)) +
          (states('input_number.kwh_consumati_sabato')|float(default=0)) +
          (states('input_number.kwh_consumati_domenica')|float(default=0))) / 7) | round(1, default=0) }}

      # OLD: Costi attuali (moltiplicazione kWh * costo)
      # --- COSTI ATTUALI ---
      - name: Costo Consumo Ogni Ora Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((states('sensor.energia_ogni_ora_casa') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      - name: Costo Consumo Giornaliero Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((states('sensor.energia_oggi_casa') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      - name: Costo Consumo Settimana Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((states('sensor.energia_settimana_casa') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      - name: Costo Consumo Mensile Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((states('sensor.energia_mese_casa') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      - name: Costo Consumo Bimestre Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((states('sensor.energia_bimestre_casa') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      - name: Costo Consumo Annuale Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((states('sensor.energia_anno_casa') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      # --- COSTI PRECEDENTI ---
      - name: Costo Consumo Ora Precedente Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((state_attr('sensor.energia_ogni_ora_casa', 'last_period') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      - name: Costo Consumo Ieri Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((state_attr('sensor.energia_oggi_casa', 'last_period') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      - name: Costo Consumo Settimana Precedente Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((state_attr('sensor.energia_settimana_casa', 'last_period') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      - name: Costo Consumo Mese Precedente Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((state_attr('sensor.energia_mese_casa', 'last_period') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      - name: Costo Consumo Bimestre Precedente Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((state_attr('sensor.energia_bimestre_casa', 'last_period') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

      - name: Costo Consumo Anno Precedente Casa
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: "{{((state_attr('sensor.energia_anno_casa', 'last_period') | float(0)) * (states('input_number.costo_energia_casa') | float(0))) | round(2, default=0) }}"

  # Top Consumo Elettrico (opzionale): il dispositivo che consuma di piu' in questo
  # momento tra tutti i sensori che finiscono per "_power". Alimenta la riga
  # "Top consumo" della card (parametro top_entity).
  - sensor:
      - name: "Top Consumo Elettrico"
        icon: mdi:trophy-award
        default_entity_id: sensor.top_consumo_elettrico
        state: >
          {% set ns = namespace(top_entity=none, max_power=0) %}
          {# sensori da NON considerare (totali/aggregati): metti qui il tuo generale #}
          {% set esclusi = ['sensor.generale_power'] %}
          {% for entity in states.sensor %}
            {% if entity.entity_id.endswith('_power') and entity.entity_id not in esclusi %}
              {% set power = states(entity.entity_id) | float(0) %}
              {% if power > ns.max_power %}
                {% set ns.max_power = power %}
                {% set ns.top_entity = entity %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.top_entity is not none and ns.max_power > 0 %}
            {{ ns.top_entity.name | replace(' Power', '') | replace(' power', '') }}: {{ ns.max_power | int }} W
          {% else %}
            Nessun consumo rilevante
          {% endif %}

####################################################
#                                                  #
#                     SENSORI                      #
#                                                  #
####################################################

sensor:
  # Questo è il sensore 'integration' e NON TEMPLATE, resta qui.
  - platform: integration
    source: sensor.sensore_potenza_casa_w
    name: w_kwh_casa
    unit_prefix: k
    round: 2

####################################################
#                                                  #
#                SCRIPT                            #
#                                                  #
####################################################

script:
  reset_sensori_energia:
    sequence:
      - service: utility_meter.calibrate
        data:
          value: "0"
        target:
          entity_id:
            - sensor.energia_ogni_ora_casa
            - sensor.energia_oggi_casa
            - sensor.energia_settimana_casa
            - sensor.energia_mese_casa
            - sensor.energia_bimestre_casa
            - sensor.energia_anno_casa

####################################################
#                                                  #
#                INPUT DATETIME                    #
#                                                  #
####################################################

input_datetime:
  orario_inizio_notifiche_soglia_elettrica_casa:
    name: Orario Inizio Notifiche Soglia Elettrica Casa
    has_date: false
    has_time: true

  ####################################################

  orario_fine_notifiche_soglia_elettrica_casa:
    name: Orario Fine Notifiche Soglia Elettrica Casa
    has_date: false
    has_time: true

####################################################
#                                                  #
#        BARRE DELLA CARD: ENTITA' SCELTA          #
#                                                  #
####################################################
# input_select.barra_N_scelta = menu a tendina mostrato nelle Impostazioni
# input_text.barra_N_entita   = la scelta vera (sopravvive ai riavvii): la card
#                               legge QUESTA. Vuoto = barra nascosta.

input_text:
  barra_1_entita:
    name: Barra 1 Entità
    icon: mdi:gauge
    max: 255

  barra_2_entita:
    name: Barra 2 Entità
    icon: mdi:gauge
    max: 255

  barra_3_entita:
    name: Barra 3 Entità
    icon: mdi:gauge
    max: 255

  barra_4_entita:
    name: Barra 4 Entità
    icon: mdi:gauge
    max: 255

input_select:
  barra_1_scelta:
    name: Barra 1 Scelta
    icon: mdi:gauge
    options:
      - "(nessuna)"

  barra_2_scelta:
    name: Barra 2 Scelta
    icon: mdi:gauge
    options:
      - "(nessuna)"

  barra_3_scelta:
    name: Barra 3 Scelta
    icon: mdi:gauge
    options:
      - "(nessuna)"

  barra_4_scelta:
    name: Barra 4 Scelta
    icon: mdi:gauge
    options:
      - "(nessuna)"


####################################################
#                                                  #
#                    AUTOMAZIONI                   #
#                                                  #
####################################################

automation:
  - alias: Automazioni Energia
    id: Automazioni Energia
    trigger:
      - platform: template
        value_template: "{{ states('sensor.sensore_potenza_casa_w') | int(0) > states('input_number.soglia_lavoro_casa_w') | int(0) }}"
        for:
          seconds: "{{ states('input_number.ritardo_superamento_soglia') }}"
        id: soglia
      - platform: time
        at: "23:59:59"
        id: notifiche_costi_consumi
      - platform: time
        at: "23:59:58"
        id: incremento_kwh
    action:

      # Incremento Kwh
      - choose:
          - conditions:
              - condition: trigger
                id: incremento_kwh
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: >
                    {% set today = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] %}
                    {% if today == "Monday" %} input_number.kwh_consumati_lunedi
                    {% elif today == "Tuesday" %} input_number.kwh_consumati_martedi
                    {% elif today == "Wednesday" %} input_number.kwh_consumati_mercoledi
                    {% elif today == "Thursday" %} input_number.kwh_consumati_giovedi
                    {% elif today == "Friday" %} input_number.kwh_consumati_venerdi
                    {% elif today == "Saturday" %} input_number.kwh_consumati_sabato
                    {% elif today == "Sunday" %} input_number.kwh_consumati_domenica
                    {% endif %}
                data:
                  value: "{{ states('sensor.energia_oggi_casa') }}"

      # Notifiche Vocali e Push/Telegram (Soglia)
      - parallel:
          # Notifica vocale Alexa
          - choose:
              - conditions:
                  - condition: trigger
                    id: soglia
                  - condition: time
                    after: input_datetime.orario_inizio_notifiche_soglia_elettrica_casa
                    before: input_datetime.orario_fine_notifiche_soglia_elettrica_casa
                  - condition: state
                    entity_id: input_boolean.notify_alexa_soglia
                    state: "on"
                sequence:
                  - repeat:
                      count: "50"
                      sequence:
                        - condition: template
                          value_template: "{{ states('sensor.sensore_potenza_casa_w') | int(0) > states('input_number.soglia_lavoro_casa_w') | int(0) }}"
                        - service: notify.alexa_media
                          continue_on_error: true
                          data:
                            target:
                              - *alexa1
                              - *alexa2
                            data:
                              type: announce
                              method: spoken
                            message: "ATTENZIONE. Superati i {{ states('input_number.soglia_lavoro_casa_w') }} watt!"
                        - delay:
                            seconds: 10

          # Notifica superamento soglia (Push & Telegram)
          - choose:
              - conditions:
                  - condition: trigger
                    id: soglia
                  - condition: state
                    entity_id: input_boolean.notify_push_soglia
                    state: "on"
                sequence:
                  - service: notify.mobile_app_il_tuo_telefono
                    data:
                      message: "⚠️ ATTENZIONE. Superati i {{ states('input_number.soglia_lavoro_casa_w') }}w ⚡️"
                      title: "⚠️ Consumi Elevati ⚠️"
                  - service: notify.mobile_app_del_partner
                    data:
                      message: "⚠️ ATTENZIONE. Superati i {{ states('input_number.soglia_lavoro_casa_w') }}w ⚡️"
                      title: "⚠️ Consumi Elevati ⚠️"

          # Notifica superamento soglia su Telegram (flag proprio: notify_telegram_soglia)
          - choose:
              - conditions:
                  - condition: trigger
                    id: soglia
                  - condition: state
                    entity_id: input_boolean.notify_telegram_soglia
                    state: "on"
                sequence:
                  - service: telegram_bot.send_message
                    data:
                      parse_mode: html
                      chat_id:
                        - 111111111
                        - 222222222
                      message: "⚠️ ATTENZIONE. Superati i {{ states('input_number.soglia_lavoro_casa_w') }}w ⚡️"
                      title: "<b>⚠️ Consumi Elevati ⚠️</b>"

      # Notifiche Consumi GIORNALIERA, MENSILE, ANNUALE
      - choose:
          # GIORNALIERA
          - conditions:
              - condition: trigger
                id: notifiche_costi_consumi
              - condition: state
                entity_id: input_boolean.notify_push_costi_giornalieri
                state: "on"
            sequence:
              - service: telegram_bot.send_message
                data:
                  parse_mode: html
                  chat_id:
                    - 111111111
                    - 222222222
                  message: "Oggi {{ now().day }}/{{ now().month }}/{{ now().year }} hai consumato ⚡️ {{ states('sensor.energia_oggi_casa') }} kWh per un costo di {{ states('sensor.costo_consumo_giornaliero_casa') }} €."
                  title: "<b>💰⚡️ Consumi Giornalieri ⚡️💰</b>"
              - service: notify.mobile_app_il_tuo_telefono
                data:
                  message: "Oggi {{ now().day }}/{{ now().month }}/{{ now().year }} hai consumato ⚡️ {{ states('sensor.energia_oggi_casa') }} kWh per un costo di {{ states('sensor.costo_consumo_giornaliero_casa') }} €."
                  title: "💰⚡️ Consumi ⚡️💰"
              - service: notify.mobile_app_del_partner
                data:
                  message: "Oggi {{ now().day }}/{{ now().month }}/{{ now().year }} hai consumato ⚡️ {{ states('sensor.energia_oggi_casa') }} kWh per un costo di {{ states('sensor.costo_consumo_giornaliero_casa') }} €."
                  title: "💰⚡️ Consumi ⚡️💰"

          # MENSILE
          - conditions:
              - condition: trigger
                id: notifiche_costi_consumi
              - condition: state
                entity_id: input_boolean.notify_push_costi_mensili
                state: "on"
              - condition: template
                value_template: "{{ (now() + timedelta(days=1)).day == 1 }}"
            sequence:
              - service: telegram_bot.send_message
                data:
                  parse_mode: html
                  chat_id:
                    - 111111111
                    - 222222222
                  message: "Nel mese di {{ ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'][now().month-1] }} hai consumato ⚡️ {{ states('sensor.energia_mese_casa') }} kWh per un costo di {{ states('sensor.costo_consumo_mensile_casa') }} €."
                  title: "<b>💰⚡️ Consumi Mensili ⚡️💰</b>"
              - service: notify.mobile_app_il_tuo_telefono
                data:
                  message: "Nel mese di {{ ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'][now().month-1] }} hai consumato ⚡️ {{ states('sensor.energia_mese_casa') }} kWh per un costo di {{ states('sensor.costo_consumo_mensile_casa') }} €."
                  title: "💰⚡️ Consumi ⚡️💰"
              - service: notify.mobile_app_del_partner
                data:
                  message: "Nel mese di {{ ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'][now().month-1] }} hai consumato ⚡️ {{ states('sensor.energia_mese_casa') }} kWh per un costo di {{ states('sensor.costo_consumo_mensile_casa') }} €."
                  title: "💰⚡️ Consumi ⚡️💰"

          # ANNUALE
          - conditions:
              - condition: trigger
                id: notifiche_costi_consumi
              - condition: state
                entity_id: input_boolean.notify_push_costi_annuali
                state: "on"
              - condition: template
                value_template: "{{ now().day == 31 and now().month == 12 }}"
            sequence:
              - service: telegram_bot.send_message
                data:
                  parse_mode: html
                  chat_id:
                    - 111111111
                    - 222222222
                  message: "Nel {{ now().year }} hai consumato ⚡️ {{ states('sensor.energia_anno_casa') }} kWh per un costo di {{ states('sensor.costo_consumo_annuale_casa') }} €."
                  title: "<b>💰⚡️ Consumi Annuali ⚡️💰</b>"
              - service: notify.mobile_app_il_tuo_telefono
                data:
                  message: "Nel {{ now().year }} hai consumato ⚡️ {{ states('sensor.energia_anno_casa') }} kWh per un costo di {{ states('sensor.costo_consumo_annuale_casa') }} €."
                  title: "💰⚡️ Consumi ⚡️💰"
              - service: notify.mobile_app_del_partner
                data:
                  message: "Nel {{ now().year }} hai consumato ⚡️ {{ states('sensor.energia_anno_casa') }} kWh per un costo di {{ states('sensor.costo_consumo_annuale_casa') }} €."
                  title: "💰⚡️ Consumi ⚡️💰"

  # --- Barre della card: menu a tendina delle entita' -----------------------
  - alias: "Energia barre: aggiorna elenco entita"
    id: energia_barre_aggiorna_elenco
    mode: queued
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "5"
      - trigger: event
        event_type: energia_barre_aggiorna
    actions:
      # All'avvio si aspetta che i sensori siano stati creati.
      - if:
          - condition: template
            value_template: "{{ trigger.platform == 'homeassistant' }}"
        then:
          - delay: "00:00:45"
      - repeat:
          for_each: [1, 2, 3, 4]
          sequence:
            - variables:
                sel: "{{ states('input_text.barra_' ~ repeat.item ~ '_entita') }}"
                lista: >-
                  {% set base = states.sensor | selectattr('entity_id', 'search', '_power$') | map(attribute='entity_id') | list %}
                  {% set extra = states.sensor | selectattr('attributes.unit_of_measurement', 'in', ['W', 'kW']) | map(attribute='entity_id') | list %}
                  {% set corrente = [sel] if sel not in ['', 'unknown', 'unavailable'] else [] %}
                  {{ ['(nessuna)'] + ((base + extra + corrente) | unique | sort | list) }}
            - action: input_select.set_options
              target:
                entity_id: "input_select.barra_{{ repeat.item }}_scelta"
              data:
                options: "{{ lista }}"
            - action: input_select.select_option
              target:
                entity_id: "input_select.barra_{{ repeat.item }}_scelta"
              data:
                option: "{{ sel if sel in lista else '(nessuna)' }}"

  - alias: "Energia barre: salva scelta"
    id: energia_barre_salva_scelta
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - input_select.barra_1_scelta
          - input_select.barra_2_scelta
          - input_select.barra_3_scelta
          - input_select.barra_4_scelta
    conditions:
      # Solo scelte fatte da una persona: i cambi fatti dall'automazione qui sopra
      # (che ricostruisce l'elenco) non hanno un utente e non devono cancellare la scelta.
      - condition: template
        value_template: >-
          {{ trigger.to_state.context.user_id is not none
             and trigger.from_state is not none
             and trigger.from_state.state != trigger.to_state.state }}
    actions:
      - action: input_text.set_value
        target:
          entity_id: "input_text.barra_{{ trigger.to_state.object_id.split('_')[1] }}_entita"
        data:
          value: "{{ '' if trigger.to_state.state == '(nessuna)' else trigger.to_state.state }}"
