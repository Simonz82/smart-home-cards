# Layout delle card - un menu "Classico / Centrato" per ogni card.
# Autore: Simonz82 - https://github.com/Simonz82/smart-home-cards
#
# Ogni card ha il parametro `layout_entity` che punta a uno di questi menu: cambiando il valore
# (dalla prima riga "Layout" delle Impostazioni della card) la card cambia aspetto subito.
# Puoi togliere le righe delle card che non usi. Vedi docs/layout.md.
#
# Copia il file in /config/packages/ e riavvia Home Assistant.

input_select:
  layout_lavatrice:
    name: Layout Lavatrice
    icon: mdi:view-dashboard-outline
    options:
      - Classico
      - Centrato
