# ============================================================================
# Automazioni per la card FritzBox / Router (dm-fritz-card)
# Guida di riferimento: ../docs/fritzbox.md
#
# COSA DEVI CAMBIARE PER USARLO CON IL TUO IMPIANTO
# ----------------------------------------------------------------------------
# 1. sensor.fritzbox                   -> il TUO connection_entity (creato
#                                          dall'integrazione FRITZ!Box Tools)
# 2. notify.mobile_app_il_tuo_telefono -> il TUO servizio notifiche
# 3. notify.alexa_media_soggiorno      -> il TUO dispositivo Alexa (elimina
#                                          questa parte se non usi Alexa)
# 4. script.fritz_box_riconnetti /
#    script.fritz_box_riavvia          -> se non li hai ancora creati, sono
#                                          in fondo a questo file, pronti
# ============================================================================

input_boolean:
  notify_push_fritz:
    name: "FritzBox - Notifica Online"
  notify_alexa_fritz:
    name: "FritzBox - Notifica Alexa"
  notify_ip_push:
    name: "FritzBox - Notifica Cambio IP"

input_datetime:
  orario_inizio_notifiche_fritz:
    name: "FritzBox - Inizio fascia notifiche"
    has_time: true
    has_date: false
  orario_fine_notifiche_fritz:
    name: "FritzBox - Fine fascia notifiche"
    has_time: true
    has_date: false

script:
  fritz_box_riconnetti:
    alias: "FritzBox - Cambia IP"
    sequence:
      - service: fritzbox.reconnect
  fritz_box_riavvia:
    alias: "FritzBox - Riavvia"
    sequence:
      - service: fritzbox.reboot

automation:
  - alias: "FritzBox - notifica torna online/offline"
    description: "Avvisa quando il router si disconnette o si riconnette a Internet."
    trigger:
      - platform: state
        entity_id: sensor.fritzbox
        to: "Connected"
        id: "online"
      - platform: state
        entity_id: sensor.fritzbox
        to: "Disconnected"
        id: "offline"
    condition:
      - condition: time
        after: input_datetime.orario_inizio_notifiche_fritz
        before: input_datetime.orario_fine_notifiche_fritz
    action:
      - if:
          - condition: state
            entity_id: input_boolean.notify_push_fritz
            state: "on"
        then:
          - service: notify.mobile_app_il_tuo_telefono
            data:
              title: "📶 FritzBox"
              message: "{{ 'Connessione ripristinata ✅' if trigger.id == 'online' else 'Connessione persa ⚠️' }}"
      - if:
          - condition: and
            conditions:
              - condition: state
                entity_id: input_boolean.notify_alexa_fritz
                state: "on"
              - condition: template
                value_template: "{{ trigger.id == 'online' }}"
        then:
          - service: notify.alexa_media_soggiorno
            data:
              message: "La connessione internet è tornata attiva"
              data:
                type: announce

  - alias: "FritzBox - notifica cambio IP pubblico"
    description: "Avvisa quando l'IP pubblico del router cambia (utile se hai servizi che dipendono da un IP fisso/DDNS)."
    trigger:
      - platform: state
        entity_id: sensor.fritzbox
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unknown','unavailable'] and trigger.from_state.state != trigger.to_state.state }}"
      - condition: state
        entity_id: input_boolean.notify_ip_push
        state: "on"
    action:
      - service: notify.mobile_app_il_tuo_telefono
        data:
          title: "📶 FritzBox — IP cambiato"
          message: "Nuovo IP pubblico: {{ trigger.to_state.state }}"
